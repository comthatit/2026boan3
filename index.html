dding:10px 16px;box-shadow:0 7px 24px #1a324355;opacity:0;pointer-events:none;transition:.2s;z-index:12;font-size:13px}.toast.show{opacity:1}.banner{background:#fffaf0;border:1px solid #f2e3c3;border-radius:10px;padding:11px 14px;color:#795c2a;font-size:12px}.kbd{font:11px Consolas,monospace;background:#f1f5fa;border:1px solid #dce5f1;border-radius:4px;padding:1px 5px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pillStar{color:#aa6a10;font-weight:900;font-size:13px}.mutedBlock{background:#f6f8fb;border-radius:11px;padding:15px}.mt{margin-top:15px}.mb{margin-bottom:15px}.right{text-align:right}.center{text-align:center}

<script>
'use strict';
const DATA=[{"id":"risk-bcp","n":1,"title":"위험관리 · ALE · BIA · 업무연속성","priority":3,"area":"05 정보보호관리 및 법률","summary":"위험분석은 위협·취약점·자산을 식별하고 ALE=SLE×ARO를 계산하며 보호대책의 비용·효과를 판단한다.","sourceDetails":["① SLE(단일 손실 예상액)=자산 가치×노출계수(EF). ARO는 연간 예상 발생 빈도, ALE=SLE×ARO는 연간 예상 손실액이다.","② 정성 평가는 상중하 등 등급을, 정량 평가는 금액·확률 등 수치로 평가한다. 수용·회피·전가·감소는 서로 다른 위험 처리 방식이다.","③ BIA(업무영향분석)는 업무 중단의 영향과 우선순위를 평가한다. RTO는 목표 복구시간, RPO는 허용 가능한 데이터 손실 시점이다.","④ DRP는 IT 재해복구계획, BCP는 조직 업무 연속성을 포함하는 포괄적 계획이다.","위험관리에서 자산은 보호할 가치가 있는 대상, 위협은 손실을 일으킬 수 있는 잠재 요인, 취약점은 그 위협이 악용할 수 있는 약점이다. 위험은 위협과 취약점, 자산 가치 및 영향의 관계로 평가한다. 정량평가에서는 자산가치 AV × 노출계수 EF = SLE, SLE × 연간발생률 ARO = ALE를 사용할 수 있다. 위험 처리에는 수용·회피·감소·전가가 있다."],"example":"AV=1,000만 원, EF=0.3, ARO=0.2\nSLE=1,000만×0.3=300만 원\nALE=300만×0.2=60만 원\nRTO=복구 목표 시간, RPO=허용 데이터 손실 복구 시점","question":"자산가치 1000만원, EF 30%, ARO 0.2일 때 ALE를 계산하고 위험 처리 방법 네 가지를 쓰시오.","answer":"SLE는 단일 사고가 발생할 때 예상되는 손실액이므로 1000만 원×0.3=300만 원이다. ALE는 연간 예상 손실액으로 SLE×ARO=300만 원×0.2=60만 원이다. 위험 회피는 위험을 유발하는 활동 중지, 감소는 보안통제를 통한 가능성·영향 축소, 전가는 보험·계약 등으로 손실 부담 이전, 수용은 허용 가능한 잔여 위험을 승인하고 감수하는 것이다.","keywords":"SLE 300만, ALE 60만, 회피·감소·전가·수용","pitfall":"RPO 2시간이므로 복구를 2시간 이내 완료한다는 뜻은 아님. 그 시간은 RTO이다.","sourceUrl":"https://csrc.nist.gov/projects/risk-management","compact":"자산(보호 대상)·위협(손실을 유발할 잠재 원인)·취약점(악용 가능한 약점). 위험식별→분석→평가→대책 선정·구현. 위험처리: 감소·회피·전가·수용. SLE=자산가치×노출계수, ALE=SLE×연간발생률.","walk":[{"title":"핵심 용어부터 구별","body":"자산은 보호할 가치가 있는 대상(서버·데이터 등), 위협은 장애·공격 같은 잠재 원인, 취약점은 위협이 악용할 수 있는 약점이다. 먼저 문제가 어떤 자산의 어떤 손실을 묻는지 표시한다."},{"title":"계산 항목을 대응","body":"자산가치(AV)는 전체 자산의 가치이고 노출계수(EF)는 한 번 사고가 났을 때 잃는 비율이다. AV와 EF로 1회 손실(SLE)을 구하고, 연간 발생률(ARO)을 곱해 연간 손실(ALE)을 구한다."},{"title":"단계별 수치 계산","body":"자산가치 1,000만 원 × EF 0.3 = SLE 300만 원이다. ARO가 연 0.2회라면 ALE = 300만 원 × 0.2 = 연간 60만 원이다. 0.2회는 2회가 아니므로 단위를 함께 확인한다."},{"title":"대응책을 네 갈래로 정리","body":"위험 감소는 보안대책으로 가능성/영향을 줄이는 것, 회피는 위험을 만드는 업무를 중단하는 것, 전가는 보험·계약 등으로 손실부담을 옮기는 것, 수용은 정한 기준 내에서 감수하는 것이다."},{"title":"답안 완성·검산","body":"서술에서는 공식을 먼저 쓰고 SLE→ALE 계산을 명시한 뒤 네 가지 처리 방법을 각각 1문장으로 작성한다. BCP는 업무 지속, DRP는 IT 복구, RTO는 복구 목표 시간, RPO는 허용 데이터 손실 범위를 뜻한다."}],"compactNotes":[{"title":"위험관리","content":"자산(보호 대상)·위협(손실을 유발할 잠재 원인)·취약점(악용 가능한 약점). 위험식별→분석→평가→대책 선정·구현. 위험처리: 감소·회피·전가·수용. SLE=자산가치×노출계수, ALE=SLE×연간발생률."},{"title":"BCP·DRP·RTO·RPO","content":"BCP=핵심 업무 지속 계획, DRP=재해 발생 후 IT 복구 계획. RTO=허용 가능한 복구 목표 시간, RPO=허용 가능한 데이터 손실 시점 간격. 복구 우선순위·백업·훈련 연계."}],"shortQuestion":{"question":"자산가치 2,000만 원, EF 25%, ARO 0.4일 때 SLE와 ALE를 각각 쓰시오.","answer":"SLE 500만 원, ALE 연 200만 원","keywords":["SLE","500만","ALE","200만"]}},{"id":"xss-csrf","n":2,"title":"XSS · CSRF · 쿠키 속성","priority":3,"area":"03 애플리케이션 보안","summary":"XSS는 브라우저에서 악성 스크립트 실행, CSRF는 로그인 세션을 이용한 의도하지 않은 상태변경 요청이다.","sourceDetails":["① XSS 방어는 출력 위치에 맞는 인코딩이 핵심이며 HTML 입력 허용 시 검증된 Sanitizer 사용. CSP는 추가 방어계층이다. HttpOnly는 JS의 쿠키 접근을 막지만 모든 XSS 영향을 제거하지 않는다.","② CSRF 방어는 서버가 세션과 연결해 검증하는 예측 불가능한 토큰, Origin/Referer 확인, SameSite 쿠키 등을 함께 사용한다. POST 메서드만으로 방어할 수 없다.","③ Secure 쿠키는 HTTPS 통신에만 전송, HttpOnly는 JS document.cookie 접근 제한, SameSite는 사이트 간 전송 정책을 정의한다.","XSS는 신뢰할 수 없는 데이터가 브라우저에서 코드로 해석되어 실행되는 문제다. 저장형은 서버에 스크립트가 저장되고, 반사형은 요청이 응답에 반영되며, DOM 기반은 브라우저의 클라이언트 코드가 위험한 DOM API를 사용한다. CSRF는 이미 인증된 사용자의 브라우저가 공격자가 지정한 상태 변경 요청을 보내도록 만드는 문제로, 사용자의 세션 쿠키가 자동 첨부되는 점을 악용한다."],"example":"Set-Cookie: session=...; Secure; HttpOnly; SameSite=Lax\n# XSS 대응: 출력 문맥별 인코딩, innerHTML 대신 textContent 사용\n# CSRF 대응: 상태 변경 요청에 서버 검증 CSRF 토큰\n# CSP는 XSS 보조 통제, SameSite는 CSRF 보조 통제","question":"게시판 스크립트 실행과 로그인 사용자의 임의 계좌 변경 요청이 각각 발생했다. 취약점 유형과 핵심 대응책을 쓰시오.","answer":"게시판의 악성 스크립트가 방문자 브라우저에서 실행되었다면 저장형 XSS일 수 있다. 사용자의 출력 위치에 맞는 인코딩, 신뢰할 수 있는 HTML 정화, 안전한 DOM API, CSP 등을 적용한다. 사용자가 의도하지 않았지만 로그인 쿠키가 포함된 요청으로 계좌 설정이 바뀌었다면 CSRF가 의심된다. 상태 변경 요청에 예측할 수 없는 CSRF 토큰을 발급·검증하고 Origin 검증 및 SameSite 쿠키를 병행한다. POST만 사용한다고 CSRF가 해결되지는 않는다.","keywords":"XSS/CSRF 구분, 서버 검증 토큰, 출력 인코딩, POST만으로 불가","pitfall":"HttpOnly는 CSRF 토큰을 대신하지 않는다. SameSite=None은 Secure 요구 등 브라우저 제약을 확인한다.","sourceUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html","compact":"저장형=게시판·DB에 악성 스크립트 저장, 반사형=입력값이 응답에 반영, DOM 기반=브라우저 JS가 DOM을 위험하게 조작. 대응: 출력 문맥별 인코딩, 안전한 DOM API, 검증된 HTML 정화, CSP(보조책).","walk":[{"title":"공격 주체를 찾기","body":"악성 스크립트가 피해자의 브라우저에서 실행되는지(XSS), 로그인된 피해자의 브라우저가 본인 의사와 다른 요청을 보내는지(CSRF)를 구분한다."},{"title":"XSS 발생 위치 판단","body":"저장형은 게시판·DB 등에 악성 콘텐츠가 저장된다. 반사형은 입력값이 응답에 즉시 반영된다. DOM 기반은 브라우저 자바스크립트가 신뢰할 수 없는 값을 위험한 DOM API로 처리한다."},{"title":"CSRF 동작 단계 파악","body":"사용자가 서비스에 로그인한 상태에서 악성 페이지를 방문하면 브라우저가 기존 세션 쿠키를 포함해 의도하지 않은 상태 변경 요청을 보낼 수 있다. 이때 공격자가 세션 쿠키를 탈취할 필요는 없다."},{"title":"방어책을 공격에 맞춰 연결","body":"XSS는 HTML/속성/URL/JS 등 출력 위치에 맞는 인코딩과 안전한 DOM API를 사용한다. CSRF는 서버에서 세션에 연계된 토큰을 검증하고 Origin·SameSite를 보조 통제로 활용한다."},{"title":"쿠키 속성과 한계까지 작성","body":"Secure는 HTTPS에서 쿠키 전송, HttpOnly는 자바스크립트의 쿠키 직접 접근 제한, SameSite는 사이트 간 요청 쿠키 전송 제한이다. HttpOnly만으로 XSS 자체가 제거되거나 POST만으로 CSRF가 해결되지는 않는다."}],"compactNotes":[{"title":"XSS 3유형","content":"저장형=게시판·DB에 악성 스크립트 저장, 반사형=입력값이 응답에 반영, DOM 기반=브라우저 JS가 DOM을 위험하게 조작. 대응: 출력 문맥별 인코딩, 안전한 DOM API, 검증된 HTML 정화, CSP(보조책)."}],"shortQuestion":{"question":"저장형 XSS·반사형 XSS·DOM 기반 XSS를 각각 한 구절로 구분하시오.","answer":"저장형: 서버에 악성 스크립트 저장 / 반사형: 요청값이 응답에 반영 / DOM 기반: 클라이언트 DOM 처리 중 실행","keywords":["저장","반사","DOM"]}},{"id":"linux-perm","n":3,"title":"리눅스 권한 · umask · 특수권한","priority":3,"area":"01 시스템 보안","summary":"파일은 기본 최대 666, 디렉터리는 777에서 umask로 비트를 제거한다. SetUID·SetGID·Sticky Bit는 서로 용도가 다르다.","sourceDetails":["① 일반 파일 666, 디렉터리 777을 기본 권한 상한으로 보고 umask 비트와 AND NOT 연산하여 생성 권한을 계산한다. 022라면 파일 644, 디렉터리 755이다. 단순한 십진수 빼기가 아니라 비트 제거이다.","② SetUID(4000)는 실행 파일의 유효 UID를 소유자로 설정한다. SetGID(2000)는 실행 파일의 유효 GID를 그룹으로 설정하며, 디렉터리에서는 새 파일의 그룹 상속에 관여한다.","③ Sticky Bit(1000)는 /tmp와 같이 누구나 쓰는 디렉터리에서 파일 삭제·이름 변경을 파일 소유자·디렉터리 소유자·특권 사용자 등으로 제한한다.","④ 탐지: find / -type f -perm -4000 2\u003e/dev/null, find / -type f -perm /6000 2\u003e/dev/null. -4000은 해당 비트 모두, /6000은 지정 비트 중 하나 이상이다.","권한은 소유자(u)·그룹(g)·기타 사용자(o)별 읽기(r=4), 쓰기(w=2), 실행(x=1)을 구분한다. 디렉터리에서 x는 내부 이름을 탐색하고 진입할 수 있는 권한이며, r은 목록을 읽는 권한이다. chmod 4755처럼 네 자리로 표기할 때 맨 앞 4는 SetUID를 의미한다. 파일 권한을 일괄 777로 바꾸는 것은 보안 대책이 아니라 권한 확대다."],"example":"ls -ld /tmp     # 일반적으로 drwxrwxrwt (1777)\nchmod 1777 /srv/shared\nfind / -type f -perm -4000 2\u003e/dev/null\nfind / -type f -perm /6000 2\u003e/dev/null\nchmod u-s /path/to/unneeded-suid","question":"공용 디렉터리 /srv/shared를 1777로 구성하는 이유와 SUID 파일 탐색·제거 명령을 설명하시오.","answer":"공용 디렉터리에 쓰기 권한을 부여하더라도 Sticky Bit를 설정하면 일반 사용자는 타인의 파일을 임의로 삭제하거나 이름을 바꿀 수 없다(디렉터리 소유자와 특권 사용자 등은 예외). chmod 1777 /srv/shared로 설정한다. SUID 파일은 find / -type f -perm -4000 2\u003e/dev/null로 식별하고, 불필요한 SUID 비트는 검토 후 chmod u-s 파일명으로 제거한다.","keywords":"SUID=4000, Sticky=1000, 1777, find -4000, chmod u-s","pitfall":"계정 UID 0은 특권 계정, GID 0만으로 동일 권한은 아님. chmod 777이 보안 대책은 아님.","sourceUrl":"https://man7.org/linux/man-pages/man1/chmod.1.html","compact":"SUID(4000)=파일 소유자 권한으로 실행, SGID(2000)=파일 그룹 권한으로 실행, Sticky(1000)=공유 디렉터리에서 임의 삭제 제한. 탐색: find / -type f -perm -4000 2\u003e/dev/null; -2000은 SGID; /6000은 둘 중 하나.","walk":[{"title":"기본 권한을 읽기","body":"r=4, w=2, x=1이고 chmod 755는 소유자 rwx(7), 그룹 r-x(5), 기타 r-x(5)라는 뜻이다. 디렉터리의 x는 탐색·진입, r은 목록 조회와 관계된다."},{"title":"umask 계산하기","body":"파일의 기본 최대권한 666, 디렉터리는 777에서 umask 비트를 제거한다. umask 022이면 파일 644, 디렉터리 755가 된다. 단순한 십진수 뺄셈이 아니라 비트 마스킹이다."},{"title":"특수권한 해석하기","body":"4000은 SetUID(실행 파일의 소유자 유효 UID), 2000은 SetGID(실행 파일의 그룹 유효 GID), 1000은 Sticky Bit(공유 디렉터리의 임의 삭제/이름변경 제한)다."},{"title":"명령어와 옵션 읽기","body":"find / -type f -perm -4000은 SUID 비트가 설정된 일반 파일을 찾는다. -perm /6000은 SUID와 SGID 중 하나라도 설정된 파일을 찾는다. chmod u-s는 불필요한 SUID를 제거한다."},{"title":"문제에서 안전성 판단하기","body":"root 소유 SUID 프로그램에 일반 사용자 쓰기권한까지 있으면 권한 상승 위험이 매우 커진다. 필요성 확인, 변경이력 조사, 권한 제거 및 검증까지 써야 한다. 777 부여는 보안조치가 아니다."}],"compactNotes":[{"title":"리눅스 특수 권한","content":"SUID(4000)=파일 소유자 권한으로 실행, SGID(2000)=파일 그룹 권한으로 실행, Sticky(1000)=공유 디렉터리에서 임의 삭제 제한. 탐색: find / -type f -perm -4000 2\u003e/dev/null; -2000은 SGID; /6000은 둘 중 하나."}],"shortQuestion":{"question":"SetUID·SetGID·Sticky Bit의 권한 숫자를 순서대로 쓰시오.","answer":"4000, 2000, 1000","keywords":["4000","2000","1000"]}},{"id":"detection","n":4,"title":"방화벽 · Snort/Suricata · 탐지 룰","priority":3,"area":"02 네트워크 보안","summary":"방화벽은 통신 허용·차단, IDS는 탐지·경보, IPS는 통신 경로에서 차단할 수 있다.","sourceDetails":["① Snort 룰 헤더는 action proto sourceIP sourcePort -\u003e destinationIP destinationPort, 옵션은 괄호 내 msg, content, sid, rev 등으로 정의한다.","② Snort3의 http_uri;는 정규화된 URI 버퍼를 선택하는 sticky buffer이며 그 뒤의 content는 해당 버퍼를 대상으로 검색한다.","③ depth는 검사 시작 지점으로부터 검색 범위를 제한하며 offset은 검색 시작 위치에 관여한다. 탐지 룰은 예외 트래픽과 오탐 여부를 확인해 배포해야 한다.","④ iptables -A는 체인 끝에, -I는 지정 위치에 삽입한다. 실제 규칙은 순서대로 평가하므로 정책 우선순위가 중요하다.","방화벽은 허용/차단 정책을 집행하며, IDS는 탐지·경고, IPS는 인라인에서 탐지 및 차단한다. iptables의 INPUT은 로컬 목적지, OUTPUT은 로컬 발신, FORWARD는 라우팅 통과 패킷이다. Snort 룰은 액션·프로토콜·주소·포트·방향의 헤더와 msg/content/sid/rev 등 옵션으로 나뉜다."],"example":"iptables -A INPUT -p tcp --dport 23 -j DROP\n# 아래 예시는 HTTP 시작 부분 탐지의 교육용 룰\nalert tcp any any -\u003e $HOME_NET 80 (msg:\"HTTP GET\"; content:\"GET\"; depth:3; sid:1000001; rev:1;)\n# 운영 시 엔진·버전별 구문 검증 필요","question":"Snort 룰 content:\"GET\"; depth:3; sid:1000001;의 의미와 오탐이 생길 수 있는 이유를 설명하시오.","answer":"content:\"GET\"은 대상 패킷 내용에서 해당 문자열을 찾도록 하는 조건이다. depth:3은 지정한 검색 기준점으로부터 3바이트 범위만 검사하도록 제한하고, sid는 룰 식별번호다. 정상 HTTP GET 요청에도 같은 문자열이 있으므로 해당 룰 하나만으로 공격이라 확정할 수 없다. URI, 요청 빈도, 출발지 특성 및 다른 로그와 함께 상관 분석해야 한다.","keywords":"content, depth, sid, 정상 트래픽 오탐","pitfall":"탐지 규칙 작성만으로 자동 차단되는 것은 아니다. IDS/IPS 배치와 룰 action을 구분한다.","sourceUrl":"https://docs.snort.org/rules/options/","compact":"외부 입력을 SQL 구문에 직접 연결해 질의 구조가 바뀜. 원인: 문자열 연결. 대응: Prepared Statement·바인딩, 계정 최소 권한, 오류 정보 최소화. 단순 이스케이프·필터링만으로 대체 불가.","walk":[{"title":"장비의 목적 구분","body":"방화벽은 연결·주소·포트 등 정책에 따른 통신 제어가 핵심이다. IDS는 공격 징후를 탐지·경보하고, IPS는 통신 경로에서 탐지한 패킷을 차단할 수 있다."},{"title":"Snort 헤더를 먼저 읽기","body":"alert tcp any any -\u003e $HOME_NET 80에서 alert는 동작, tcp는 프로토콜, 앞의 any any는 출발지 주소·포트, 화살표는 방향, $HOME_NET 80은 목적지 주소·포트이다."},{"title":"괄호 안 옵션 해석","body":"msg는 경보 메시지, content는 검사할 문자열, depth는 검사 시작점부터 조사할 길이, sid는 룰 식별자, rev는 수정 버전이다. 룰에 따라 검색 버퍼와 오프셋이 달라질 수 있다."},{"title":"탐지와 침해확정 분리","body":"content:\"GET\"으로 탐지됐다고 악성 공격이 확정되지는 않는다. 정상 GET 요청에도 해당 패턴이 존재하므로 다른 로그, 경로, 요청 빈도, 페이로드 등을 함께 살펴야 한다."},{"title":"오탐·미탐을 답안에 포함","body":"오탐(FP)은 정상을 공격이라고 탐지, 미탐(FN)은 실제 공격을 놓치는 것이다. 룰 세분화와 문맥 검증으로 오탐을 줄이되 미탐이 증가하지 않는지 시험한다."}],"compactNotes":[{"title":"방화벽·ACL","content":"iptables 기본 체인 INPUT(들어옴), OUTPUT(나감), FORWARD(경유). 예: iptables -A INPUT -p tcp --dport 23 -j DROP. DROP=응답 없이 폐기, REJECT=거부 응답. ACL은 위에서 아래로 순차 일치, 미일치 시 암묵적 거부에 유의."},{"title":"Snort 룰·오탐","content":"alert tcp any any -\u003e $HOME_NET 80 (msg:\"WEB\"; content:\"GET\"; sid:1000001; rev:1;). msg=경고 문구, content=패턴, depth=검사 시작점부터 길이 제한. 오탐(FP)=정상→공격 판단; 미탐(FN)=공격→정상 판단."},{"title":"보안관제 솔루션","content":"SIEM=로그 수집·상관 분석·경보, SOAR=탐지·분석 후 플레이북 자동화, EDR=엔드포인트 행위 탐지·대응, DLP=민감정보 유출 차단, WAF=HTTP 계층 웹공격 필터링."}],"shortQuestion":{"question":"Snort 룰 옵션 msg, content, depth, sid의 의미를 쓰시오.","answer":"msg=경보 문구, content=탐지 문자열, depth=검색 범위 길이 제한, sid=룰 식별번호","keywords":["msg","content","depth","sid"]}},{"id":"sql-injection","n":5,"title":"SQL Injection · 안전한 질의","priority":3,"area":"03 애플리케이션 보안","summary":"바인딩은 데이터값을 SQL 코드와 분리하며, 컬럼·정렬 방향 등 SQL 구조는 허용목록 방식으로 처리한다.","sourceDetails":["① 위험 코드: SELECT * FROM users WHERE id=\" + userInput. 문자열 연결로 사용자가 SQL 구문에 영향을 준다.","② 안전 코드: SELECT * FROM users WHERE id=? 와 별도 파라미터 바인딩. mysql2의 execute(sql,[id])처럼 준비된 명령을 사용한다.","③ ORDER BY 열 이름, ASC/DESC 등의 SQL 구조는 값 자리표시자로 대체할 수 없으므로 미리 정한 항목에서만 선택한다.","④ DB 계정 최소 권한, 에러 노출 제한, 로그 분석을 추가하되 WAF·문자열 치환만으로 근본 방어했다고 쓰지 않는다.","SQL 인젝션은 단순히 특정 특수문자를 사용한다는 사실이 아니라 신뢰할 수 없는 값이 SQL 문법 구조에 편입되는 문제다. 쿼리 문자열을 값과 분리하고 Prepared Statement를 사용하면 입력값은 SQL 문법이 아닌 데이터로 처리된다. 테이블명·정렬 컬럼처럼 바인딩할 수 없는 식별자는 고정된 허용목록에 매핑한다. 최소권한 DB 계정으로 영향 범위를 줄인다."],"example":"# 취약한 예: \"SELECT ... WHERE id = \" + userInput\n# 안전한 예: SELECT * FROM users WHERE id = ?\n# DB 드라이버에서 쿼리와 값 바인딩을 분리한다.\n# ORDER BY 방향 등 SQL 키워드는 고정 허용목록으로 매핑","question":"다음 코드의 위험성과 수정 원리를 설명하시오: query = \"SELECT * FROM users WHERE id =  + id + \";","answer":"사용자가 전달한 id 값이 따옴표와 SQL 연산자를 포함하면 원래 조건문 구조가 변형될 수 있어 SQL 인젝션 위험이 있다. SQL 문장을 SELECT * FROM users WHERE id = ?처럼 고정하고 드라이버의 바인딩 API로 id를 별도의 매개변수로 전달한다. 데이터베이스 계정은 필요한 테이블·명령에만 권한을 부여하고 오류 메시지에는 SQL 구조가 노출되지 않도록 한다. 입력 검증과 WAF는 보조 대책이며 바인딩을 대체할 수 없다.","keywords":"문자열 결합 원인, Prepared Statement, 최소권한, 보조대책","pitfall":"단순한 작은따옴표 삭제는 정상 입력을 훼손하고 인코딩/우회에 취약하다.","sourceUrl":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html","compact":"CSRF=로그인된 브라우저에서 원치 않는 요청 강제(토큰·SameSite·Origin 검증). SSRF=서버가 공격자가 지정한 URL에 요청(허용목록·내부망 접근 차단). XXE=XML 외부 엔티티 악용(DTD·외부 엔티티 비활성화).","walk":[{"title":"문제가 발생하는 경계 파악","body":"사용자 입력은 데이터여야 한다. 그런데 입력값을 SQL 문자열에 그대로 이어 붙이면 데이터와 SQL 문법의 경계가 무너져 질의 구조가 바뀔 수 있다."},{"title":"발생 과정을 상황에 대입","body":"예를 들어 로그인 WHERE 조건 문자열을 외부 입력으로 조립하면 예상하지 않은 조건·주석 등이 쿼리에 포함될 수 있다. 이로 인해 인증 우회나 정보 열람이 발생할 수 있다."},{"title":"근본적인 방어책 선택","body":"Prepared Statement의 플레이스홀더와 바인딩을 이용하면 입력값을 SQL 코드가 아닌 데이터로 처리한다. 쿼리 구조와 값의 전달을 분리한다는 점이 핵심이다."},{"title":"부가 대책 구분","body":"입력 형식 검증, DB 계정 최소권한, 상세 오류 노출 제한, 로깅·모니터링을 추가한다. 단, 특수문자 제거·블랙리스트·WAF만으로 플레이스홀더를 대체하지 않는다."},{"title":"서술형 구성","body":"정의(입력에 의해 SQL 구조 변조)→원인(동적 문자열 결합)→영향(조회·변조·인증우회)→핵심 대응(바인딩)→보조 통제(권한 제한 등)의 순서로 답한다."}],"compactNotes":[{"title":"SQL Injection","content":"외부 입력을 SQL 구문에 직접 연결해 질의 구조가 바뀜. 원인: 문자열 연결. 대응: Prepared Statement·바인딩, 계정 최소 권한, 오류 정보 최소화. 단순 이스케이프·필터링만으로 대체 불가."}],"shortQuestion":{"question":"SQL Injection의 가장 핵심적인 코드 수준 방어 방법은?","answer":"Prepared Statement와 바인딩 변수(매개변수화 질의) 사용","keywords":["Prepared","바인딩"]}},{"id":"ssrf-xxe","n":6,"title":"SSRF · XXE · 업로드/경로 문제","priority":3,"area":"03 애플리케이션 보안","summary":"SSRF는 서버가 임의 주소로 요청하게 하는 문제, XXE는 XML 외부 엔티티 해석 문제, 경로 탐색은 허용 범위 밖 파일 접근 문제다.","sourceDetails":["① SSRF 대응은 허용된 프로토콜·호스트·IP 대역의 엄격한 목록, DNS 재확인, 리다이렉션 통제, 네트워크 접근 통제를 적용한다. 단순 문자열 contains(host)는 호스트 혼동에 취약하다.","② XXE는 XML 파서에서 DTD/외부 엔티티 처리 금지와 안전한 파서 구성이 주된 대책이다. SQL 바인딩은 XXE의 직접 대응이 아니다.","③ 파일 업로드는 확장자·MIME·파일 시그니처 검증, 실행권한 제거, 웹루트 외부 저장, 무작위 이름, 크기 제한을 조합한다.","④ 경로 탐색은 경로 정규화 후 허용된 최상위 디렉터리 안인지 검사하고 사용자에게 직접 경로를 조립하게 하지 않는다.","SSRF는 서버가 공격자 입력값을 이용해 내부망·클라우드 메타데이터 등 원래 외부에 노출되지 않은 대상으로 요청하게 만드는 공격이다. XXE는 XML 파서가 외부 엔티티나 DTD를 처리할 때 내부 파일을 읽거나 외부에 요청할 수 있는 문제다. 웹쉘은 업로드 경로의 서버 측 스크립트 실행 설정을 악용할 수 있어 파일 형식만 검사해서는 방어가 불충분하다."],"example":"SSRF: URL 스킴·호스트 허용목록, 내부/루프백/링크로컬 차단, 리다이렉트 재검증\nXXE: DTD·외부 엔티티·외부 리소스 접근 비활성화\n업로드: 확장자·콘텐츠 검증 + 웹 루트 밖 저장 + 실행 금지\n경로순회: canonical path 확인·허용 경로만 접근","question":"외부 이미지 URL을 내려받는 서버가 내부 관리 주소에 접속한다. 공격명과 3가지 대응을 제시하시오.","answer":"사용자가 지정한 URL을 서버가 그대로 호출하면서 내부 관리 서버나 메타데이터 주소에 접근한다면 SSRF다. 접속 가능한 도메인·프로토콜을 허용목록으로 관리하고, 최종 해석된 목적지 IP가 사설·루프백·링크로컬 등에 해당하면 차단한다. 리다이렉트·DNS 재해석 시에도 목적지를 반복 검증하며, 네트워크 계층에서 애플리케이션의 내부망·메타데이터 접근을 제한한다. 사용자 입력 문자열에 127.0.0.1이 들어가는지만 확인하는 검사는 우회 가능하다.","keywords":"SSRF, 허용목록, DNS·리다이렉트 검증, 망 수준 차단","pitfall":"URL 검증이 DNS 리바인딩, 리다이렉션 등을 고려하지 않으면 충분하지 않다.","sourceUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html","compact":"의심 로그: POST 업로드 직후 .php/.jsp/.aspx 파일로 반복 접속. 대응: 확장자 허용목록+콘텐츠 확인, 랜덤 파일명, 웹 루트 밖 저장, 업로드 경로 스크립트 실행 금지, 접근제어.","walk":[{"title":"SSRF와 XXE의 진입점 나누기","body":"SSRF는 공격자가 서버에 전달한 URL을 서버가 대신 요청하는 것이고, XXE는 XML 파서가 외부 엔티티를 해석하면서 파일이나 내부/외부 자원에 접근하는 것이다."},{"title":"신뢰 경계 확인","body":"사용자가 통제할 수 있는 URL·XML 문서를 서버가 높은 네트워크 권한으로 처리한다면 내부망 접근·정보 노출 위험이 생긴다. 서로 다른 공격이지만 서버 측 신뢰 경계 침범이라는 공통점이 있다."},{"title":"SSRF 대응 구체화","body":"허용된 스킴·호스트·포트의 목록을 검증하고 DNS 재조회·리다이렉트 등 우회도 고려한다. 내부 주소/메타데이터 서비스 접근을 방화벽 등 네트워크 수준에서 제한한다."},{"title":"XXE 대응 구체화","body":"XML 파서의 DTD·외부 엔티티 해석을 비활성화하고 안전한 파서 설정을 사용한다. SQL 바인딩은 XXE의 직접적인 해결책이 아니다."},{"title":"업로드·경로 문제 연결","body":"파일 업로드는 허용 확장자·내용 검증, 웹 루트 밖 저장, 실행 차단으로, 경로 조작은 경로 정규화와 허용 디렉터리 검증으로 대응한다. 취약점별 대책을 혼동하지 않는다."}],"compactNotes":[{"title":"CSRF·SSRF·XXE","content":"CSRF=로그인된 브라우저에서 원치 않는 요청 강제(토큰·SameSite·Origin 검증). SSRF=서버가 공격자가 지정한 URL에 요청(허용목록·내부망 접근 차단). XXE=XML 외부 엔티티 악용(DTD·외부 엔티티 비활성화)."},{"title":"웹쉘·파일 업로드","content":"의심 로그: POST 업로드 직후 .php/.jsp/.aspx 파일로 반복 접속. 대응: 확장자 허용목록+콘텐츠 확인, 랜덤 파일명, 웹 루트 밖 저장, 업로드 경로 스크립트 실행 금지, 접근제어."}],"shortQuestion":{"question":"서버가 공격자 지정 URL을 요청하는 취약점과 XML 외부 엔티티 악용 취약점의 약어를 각각 쓰시오.","answer":"SSRF, XXE","keywords":["SSRF","XXE"]}},{"id":"privacy","n":7,"title":"개인정보 안전성 확보조치 · 2026 고시","priority":3,"area":"05 정보보호관리 및 법률","summary":"2026-07-01 시행 개인정보보호위원회 고시 기준으로 역할별 인터넷망 차단과 일부 위험분석 예외가 규정된다.","sourceDetails":["① 접속기록은 식별자, 접속일시, 접속지 정보, 처리한 정보주체 정보, 수행업무 등을 포함한다. 보관기간·점검·보호 조치는 현행 고시 조항을 직접 확인한다.","② 제6조의2는 전년도 말 기준 직전 3개월 간 해당 개인정보가 저장·관리된 이용자의 일일평균 수가 100만명 이상인지 판단하고, 접근권한 설정 가능자 및 개인정보 다운로드·파기 가능자의 컴퓨터 등을 대상으로 한다.","③ 다운로드/파기 담당자 일부는 내부관리계획상 위험분석 및 보호조치로 차단 예외가 가능하지만, 민감정보 또는 고시에서 정한 개인정보 처리 등 예외가 허용되지 않는 경우가 있으므로 조항을 구분한다.","④ 내부관리계획에는 담당 역할·접근권한·접속기록 점검·보안조치 등 운영 기준을 정한다.","개인정보 보호법의 큰 흐름은 수집·이용(제15조), 제3자 제공(제17조), 파기(제21조), 안전성 확보조치(제29조)로 구분한다. 접속기록은 개인식별자, 접속 시각·장소, 처리한 정보주체, 수행 업무를 포함한다. 현재 고시는 2026년 7월 1일 시행 제2026-9호다. 실기 복원 교재의 2019·2020년 고시 표현을 그대로 암기하지 않고 시점에 주의한다."],"example":"접근권한: 직무별 최소 권한 → 변경·말소 관리\n접근통제: 비인가 접근·외부망 위험 차단\n접속기록: 접속자·일시·접속지·처리정보·업무 기록 및 점검\n암호화: 법령상 보호대상과 저장·전송 환경별 적용","question":"개인정보처리시스템에서 접근권한과 접속기록의 목적 및 실무 조치사항을 설명하시오.","answer":"접근권한 관리는 개인정보취급자에게 업무 수행에 필요한 최소 권한만 부여하고 인사이동·퇴직 시 지체 없이 변경·말소하여 비인가 접근을 방지하는 조치다. 접속기록은 개인정보처리시스템에 누가, 언제, 어디서 접속해 어떤 정보주체의 정보를 어떤 업무로 처리했는지 확인할 수 있게 기록·보존하며 비정상적인 조회·다운로드 등 오남용 징후를 점검한다. 보존기간·점검 절차는 적용되는 현행 법령·고시 기준과 조직의 내부관리계획을 확인해야 한다.","keywords":"최소권한·말소, 식별자/시각/접속지/대상/수행업무, 점검·감사","pitfall":"2020년 기출의 법령 문구가 2026년 조문과 다를 수 있음. 시험 시행일 기준 공고를 확인한다.","sourceUrl":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000281400","compact":"iptables 기본 체인 INPUT(들어옴), OUTPUT(나감), FORWARD(경유). 예: iptables -A INPUT -p tcp --dport 23 -j DROP. DROP=응답 없이 폐기, REJECT=거부 응답. ACL은 위에서 아래로 순차 일치, 미일치 시 암묵적 거부에 유의.","walk":[{"title":"법령 출처와 적용 시점부터 확인","body":"시험 문항에 시행 연도나 고시 번호가 있으면 해당 시점의 기준을 우선한다. 여기서는 작성 자료에 포함된 2026년 7월 1일 시행 「개인정보의 안전성 확보조치 기준」을 설명한다."},{"title":"안전조치의 목적 정리","body":"개인정보를 안전하게 처리하기 위해 접근권한 부여·변경·말소, 접근통제, 인증, 암호화, 접속기록 보관·점검, 보안 프로그램 운영 등을 관리한다."},{"title":"접속기록 보관기간 조건 판단","body":"원칙은 1년 이상이다. 5만 명 이상 정보주체의 정보를 처리하는 시스템, 고유식별정보·민감정보를 처리하는 시스템, 특정 기간통신사업자 요건 중 하나에 해당하면 2년 이상 보관한다."},{"title":"점검의무를 문장으로 쓰기","body":"접속기록·다운로드 상황의 점검 주기·방법·사후조치 절차를 내부관리계획으로 정하고 이행한다. 과거 기출의 ‘월 1회 이상’ 문구를 2026년 기준과 자동으로 동일시하지 않는다."},{"title":"의심 사례에서 조사 흐름","body":"비정상 대량 다운로드라면 사용자·접속시각·접속지·수행업무·승인 여부 등을 확인한다. 증적을 안전하게 보관하고 권한 제한, 내부 보고, 유출 판단 및 필요한 절차를 진행한다."}],"compactNotes":[{"title":"개인정보 안전성 확보","content":"개인정보 보호법: 수집·이용(제15조), 제3자 제공(제17조), 파기(제21조), 안전성 확보조치(제29조). 최소 권한·인증·접속기록·암호화·백업·내부관리계획. 2026 시행 고시 기준 확인."}],"shortQuestion":{"question":"2026년 7월 시행 기준 접속기록 2년 이상 보관 조건을 두 가지 이상 쓰시오.","answer":"5만 명 이상 개인정보 처리시스템 / 민감정보 또는 고유식별정보 처리시스템 / 특정 기간통신사업자 요건","keywords":["5만","민감정보","고유식별정보"]}},{"id":"ddos","n":8,"title":"DoS/DDoS · 반사증폭 · 완화","priority":3,"area":"02 네트워크 보안","summary":"반사 공격은 출발지 IP 위조와 제3자 응답을, 증폭 공격은 작은 요청에 비해 큰 응답이 반환되는 특성을 이용한다.","sourceDetails":["① LAND는 출발지와 목적지 주소를 대상 IP로 동일하게 설정한 패킷을 이용한 고전적 공격이다. Smurf는 위조한 출발지 IP로 브로드캐스트 ICMP Echo를 보내 다수 호스트의 응답을 피해자에게 유도한다.","② DNS/NTP/SSDP 등 UDP 기반 응답이 반사·증폭에 악용될 수 있다. 공격자는 직접 피해자를 향해 응답을 보내지 않고 반사 서버를 이용한다.","③ 대응은 소스 주소 검증(BCP38), 불필요한 공개 응답 차단, 요청율 제한, 캐시/스크러빙·상위망 협력, 공격 트래픽 분석을 조합한다.","DoS는 공격자가 단일 또는 다수의 자원 고갈을 유발하는 넓은 개념이고 DDoS는 다수의 발신 지점에서 동시에 공격한다. SYN Flood는 연결 대기 큐를 고갈시키고, Smurf는 IP를 위조해 ICMP 브로드캐스트 반사를 유발한다. UDP 기반 DNS/NTP/SSDP 반사·증폭은 출발지 IP 위조 방지(BCP38)와 반사 서버 설정 제한이 근본적 방어다."],"example":"SYN Flood: SYN 다량 → ACK 미완료 → Half-open 자원 소모\nSmurf: 피해자 IP 위조 → 브로드캐스트 Echo 요청 → 다수 응답\nReflection: 제3자 서버가 피해자에게 응답\nAmplification: 요청 대비 응답 크기가 커지는 효과","question":"SYN Flood와 DNS 증폭 DDoS의 차이를 공격 절차·대응 관점에서 서술하시오.","answer":"SYN Flood는 TCP 연결 성립 과정에서 다수의 SYN을 보내 연결이 완료되지 않은 상태를 대량으로 만들어 서버의 연결 자원을 소모한다. SYN cookie, 연결률 제한, 상위망 DDoS 방어를 적용한다. DNS 증폭 DDoS는 피해자 주소로 출발지 IP를 위조한 UDP 질의를 반사 서버에 보내, 증폭된 응답을 피해자에게 집중시키는 공격이다. 소스 주소 위조 차단, DNS 재귀 질의 제한, 응답률 제한과 네트워크 수준의 DDoS 완화가 필요하다.","keywords":"TCP 상태 고갈 vs UDP 반사증폭, SYN cookie, anti-spoofing","pitfall":"Smurf 방어에서 호스트의 broadcast ICMP 무시와 라우터의 directed broadcast 차단은 구분한다.","sourceUrl":"https://www.rfc-editor.org/rfc/rfc2827.html","compact":"alert tcp any any -\u003e $HOME_NET 80 (msg:\"WEB\"; content:\"GET\"; sid:1000001; rev:1;). msg=경고 문구, content=패턴, depth=검사 시작점부터 길이 제한. 오탐(FP)=정상→공격 판단; 미탐(FN)=공격→정상 판단.","walk":[{"title":"증상을 관찰","body":"대량 접속·대역폭 포화·동시 연결 증가만으로 종류가 특정되지는 않는다. 패킷의 프로토콜, SYN/ACK 비율, 출발지·목적지, 요청 대비 응답 크기를 먼저 확인한다."},{"title":"SYN Flooding 구별","body":"서버가 SYN을 받고 SYN/ACK를 보냈으나 최종 ACK가 거의 오지 않으면 반개방 연결 자원이 소모될 수 있다. SYN cookies, 접속제어, 상위망 완화가 대응이다."},{"title":"Smurf/Land/Teardrop 비교","body":"Smurf는 출발지를 피해자 주소로 속인 ICMP 브로드캐스트 요청, Land는 출발지와 목적지 IP를 동일하게 만든 패킷, Teardrop은 비정상 IPv4 단편 오프셋을 악용하는 공격이다."},{"title":"반사·증폭의 두 요소 정리","body":"반사는 피해자 IP로 소스를 위조해 제3자 서버의 응답을 피해자에게 보내는 것, 증폭은 작은 요청 대비 큰 응답을 발생시키는 것이다. DNS·NTP 등 노출된 서비스가 악용될 수 있다."},{"title":"방어책을 층별로 제시","body":"출발지 위조 방지(BCP38/uRPF 등), 브로드캐스트 전달 제한, 서비스 노출 축소, 레이트리밋, CDN·스크러빙을 조합한다. 한 가지 방어만으로 모든 DDoS를 막는다고 단정하지 않는다."}],"compactNotes":[{"title":"DoS·DDoS","content":"SYN Flood=Half-open 연결 고갈. Smurf=피해자 IP 위조 후 ICMP 브로드캐스트 응답 집중. Land=출발지·목적지 IP 같게 위조. Teardrop=비정상 단편화·오프셋. 증폭공격=작은 요청으로 큰 응답 유발."}],"shortQuestion":{"question":"TCP 반개방 연결 고갈 공격, ICMP 브로드캐스트 악용 공격, 동일 출발지·목적지 IP 공격을 각각 쓰시오.","answer":"SYN Flooding, Smurf, Land","keywords":["SYN","Smurf","Land"]}},{"id":"mail-auth","n":9,"title":"SPF · DKIM · DMARC 메일 발신 인증","priority":3,"area":"01 시스템 보안","summary":"발송 서버의 IP 확인(SPF), 전자서명 검증(DKIM), 표시 발신 도메인과의 정렬 및 실패 처리 정책(DMARC).","sourceDetails":["① SPF는 봉투 발신 도메인(MAIL FROM 등)이 DNS에 공개한 정책과 실제 발신 IP를 비교한다. ② DKIM은 송신측이 메일 일부 헤더와 본문에 서명하고 수신측이 DNS에 게시된 공개키로 검증한다. ③ DMARC는 사용자에게 보이는 From 도메인과 SPF 또는 DKIM 인증 도메인 간 정렬(alignment)을 검사하고 none, quarantine, reject 정책 및 보고 체계를 제공한다. ④ SPF/DKIM 각각 성공했다고 DMARC까지 반드시 성공하는 것은 아니다.","SPF의 TXT 레코드, DKIM의 selector 공개키 레코드, DMARC의 정책 TXT 레코드는 모두 DNS를 통해 수신자가 참조한다. DKIM의 전자서명은 메일 서버·도메인 측에서 수행되며 일반 사용자의 개인키 전자서명과는 다르다. DMARC는 SPF 또는 DKIM 중 한쪽이라도 성공하고 표시 From과 도메인 정렬이 맞으면 정책상 통과할 수 있다."],"example":"v=spf1 ip4:203.0.113.0/24 -all  # 설명용 IP 대역\nselector1._domainkey.example.com TXT \"v=DKIM1; k=rsa; p=...\"\n_dmarc.example.com TXT \"v=DMARC1; p=reject; rua=mailto:postmaster@example.com\"","question":"SPF·DKIM·DMARC를 표로 비교하고 DMARC의 p=reject 의미를 설명하시오.","answer":"SPF는 발신 IP가 봉투 발신 도메인의 DNS 정책에 맞는지 검사한다. DKIM은 메일에 부착된 도메인 서명을 DNS 공개키로 검증해 서명된 부분의 무결성과 도메인 차원의 발신 인증을 확인한다. DMARC는 표시 발신 주소(From)와 SPF 또는 DKIM 인증 도메인의 정렬을 확인하고, 실패한 메일에 none·quarantine·reject 정책을 요청한다. p=reject는 DMARC 검사 실패 메일의 수신 거부를 수신측에 요청하는 정책이다.","keywords":"SPF=IP, DKIM=서명/DNS, DMARC=정렬·실패정책, reject","pitfall":"SPF는 보이는 From 주소만 검증하는 방식이 아니며, DMARC는 SPF와 DKIM을 단순히 둘 다 통과해야 성공하는 규칙이 아니다.","sourceUrl":"https://dmarc.org/overview/","compact":"SYN Flood=Half-open 연결 고갈. Smurf=피해자 IP 위조 후 ICMP 브로드캐스트 응답 집중. Land=출발지·목적지 IP 같게 위조. Teardrop=비정상 단편화·오프셋. 증폭공격=작은 요청으로 큰 응답 유발.","walk":[{"title":"먼저 세 프로토콜의 검증 대상을 정리","body":"SPF는 해당 발신 도메인을 대신해 보낼 수 있는 서버 IP, DKIM은 메일에 첨부된 서명과 서명 도메인, DMARC는 보이는 From 도메인과 SPF/DKIM의 정렬 및 실패 처리 정책을 다룬다."},{"title":"SPF 검증 과정","body":"수신 서버는 SMTP 봉투 발신 도메인 등과 DNS TXT의 SPF 정책을 조회하고 현재 접속한 송신 IP가 허용되는지 확인한다. 화면에 보이는 From 주소 자체를 직접 인증하는 것과는 다르다."},{"title":"DKIM 검증 과정","body":"발신측이 개인키로 선택한 헤더와 본문에 대한 서명을 만들고, 수신측은 DNS에 등록된 공개키로 검증한다. 전달 과정에서 서명된 내용이 변경되면 검증이 실패할 수 있다."},{"title":"DMARC 정렬 판단","body":"SPF나 DKIM 하나라도 통과하고 그 인증 도메인이 표시된 From 도메인과 정렬되면 DMARC가 통과할 수 있다. 정책 p=none/quarantine/reject로 실패 메일의 권장 처리를 알린다."},{"title":"시험 답안 완성","body":"SPF=IP 허용목록, DKIM=전자서명, DMARC=도메인 정렬+정책이라는 구별을 정확히 쓰고, DNS 레코드 역할 및 한계를 한 줄씩 덧붙인다."}],"compactNotes":[{"title":"메일 인증 3종","content":"SPF=DNS TXT를 보고 발신 서버 IP 허용 여부 검증. DKIM=송신 서버 개인키 서명, DNS 공개키 검증. DMARC=보이는 From 도메인과 SPF/DKIM 결과의 정렬, 실패 처리 정책(none/quarantine/reject)."}],"shortQuestion":{"question":"SPF, DKIM, DMARC가 각각 검증하는 핵심 대상을 쓰시오.","answer":"SPF=발신 서버 IP, DKIM=전자서명, DMARC=From 도메인 정렬과 실패 처리 정책","keywords":["SPF","DKIM","DMARC"]}},{"id":"forensics","n":10,"title":"침해사고 대응 · 디지털 포렌식","priority":3,"area":"05 정보보호관리 및 법률","summary":"증거 수집은 휘발성·무결성·연속성을 고려하고, 관찰 사실과 분석 추정을 구분해서 작성한다.","sourceDetails":["① 사고 발생 시 준비(체계·자산), 탐지·분석(로그·IOC), 봉쇄(확산 차단), 제거(원인·악성요소), 복구(정상화), 사후 개선을 구분해 답하면 좋다. 최신 NIST 800-61r3는 CSF 2.0의 Govern/Identify/Protect/Detect/Respond/Recover와 연계하는 관점으로 설명한다.","② 원본 매체는 쓰기 방지 등의 절차로 보존하고 사본 해시(SHA-256 등)를 기록한다. 획득 일시·담당자·보관·인계 내역(Chain of Custody)을 기록한다.","③ 네트워크 및 메모리의 휘발성 정보를 먼저 고려하되, 현장 안전·전파 위험을 평가해야 한다. 무작정 재부팅하면 휘발성 증거가 손실될 수 있다.","④ 정황만으로 공격 성공을 단정하지 말고 요청-응답, 프로세스·파일 생성, 유출 여부를 상관분석한다.","침해사고 대응은 탐지된 이벤트를 공격으로 확정하는 것에서 출발하지 않는다. 증거의 신뢰성, 영향 범위, 중요한 업무·인프라를 고려해 우선순위를 정하고 준비→탐지·분석→봉쇄→제거→복구→사후 개선 과정으로 설명한다. 디지털 증거는 원본과 분석본을 구분하고 수집·이송·분석·보관의 인수인계 기록(Chain of Custody)을 남긴다."],"example":"단계별 예: ① 탐지: 경보/로그 분석 ② 봉쇄: 격리·차단 ③ 제거: 악성요소/원인 제거\n④ 복구: 백업 복원·정상 확인 ⑤ 사후 분석: 원인·조치·재발방지\nNIST SP 800-61r3(2025)은 CSF 2.0 기능과 연동해 대응을 설명함","question":"랜섬웨어 감염 의심 서버를 발견했을 때 초기 조치부터 서비스 복구까지 기술하시오.","answer":"초기에는 감염 징후를 확인하고 시스템 시간, 중요 로그, 네트워크 연결, 필요 시 메모리 등 휘발성 증거를 적법한 절차에 따라 수집·보존한다. 사고 범위와 업무 영향을 파악한 뒤 감염 호스트 격리·차단으로 확산을 막고, 악성코드·지속성 수단을 제거하며 악용된 취약점과 계정을 조치한다. 신뢰할 수 있는 백업 또는 검증된 정상 이미지에서 복구하고 재감염 여부와 업무 기능을 확인한다. 모든 과정과 교훈을 기록하고 재발방지 대책을 수립한다.","keywords":"증거보전, 영향·범위, 격리, 제거·취약점, 정상복구, 재발방지","pitfall":"포렌식 해시 동일성은 수집 이후 변경 여부 확인 수단이며 사건의 적법성·진위 전체를 자동 증명하는 것은 아니다.","sourceUrl":"https://csrc.nist.gov/pubs/sp/800/61/r3/final","compact":"SPF=DNS TXT를 보고 발신 서버 IP 허용 여부 검증. DKIM=송신 서버 개인키 서명, DNS 공개키 검증. DMARC=보이는 From 도메인과 SPF/DKIM 결과의 정렬, 실패 처리 정책(none/quarantine/reject).","walk":[{"title":"목표부터 두 갈래로 생각","body":"침해사고 대응은 확산·피해를 줄이고 정상 운영을 회복하는 것이고, 디지털 포렌식은 증거의 수집·보존·분석·설명 가능성을 확보하는 것이다. 현장에서는 두 목표를 조화시킨다."},{"title":"사고 처리 단계 정리","body":"준비→탐지·분석→봉쇄→제거→복구→사후 검토 순서로 생각한다. 실제 절차는 조직 정책과 상황에 맞게 일부 병행될 수 있다."},{"title":"증거의 휘발성 고려","body":"재부팅·전원 차단 전에 메모리·현재 네트워크 연결·실행 프로세스 등 휘발성 증거를 수집할 필요가 있는지 판단한다. 안전 확보와 사업 영향도 함께 고려한다."},{"title":"포렌식의 다섯 원칙","body":"정당성(적법한 절차), 무결성(해시·원본 보존), 재현성(동일 조건에서 반복 가능), 신속성(변하기 쉬운 증거 확보), 절차 연속성(인수인계 기록)을 구분한다."},{"title":"답안에 판단 근거 남기기","body":"단순히 악성코드가 있다고 쓰지 말고 접속로그·파일 해시·프로세스·C2 통신 증거를 연계해 사건 시간을 재구성한다. 봉쇄와 함께 수집기록 및 Chain of Custody를 적는다."}],"compactNotes":[{"title":"침해사고 대응·증거","content":"준비→탐지·분석→봉쇄→제거→복구→사후 검토. 조치 전 휘발성 데이터 우선 수집 여부 판단, 증거 원본 보존·이미징·해시 비교·인수인계 기록(Chain of Custody)."},{"title":"디지털 포렌식","content":"정당성(적법한 절차), 무결성(변조 방지·해시), 재현성(동일 절차·결과), 신속성(휘발성 증거 대응), 절차 연속성(증거 관리 기록)."}],"shortQuestion":{"question":"디지털 포렌식의 다섯 원칙을 쓰시오.","answer":"정당성, 무결성, 재현성, 신속성, 절차 연속성","keywords":["정당성","무결성","재현성","신속성","연속성"]}},{"id":"linux-auth","n":11,"title":"계정 · shadow · PAM · 잠금 정책","priority":2,"area":"01 시스템 보안","summary":"/etc/passwd는 계정 메타데이터, /etc/shadow는 비밀번호 해시와 만료 정보, PAM은 서비스별 인증 정책을 담당한다.","sourceDetails":["① /etc/passwd의 x 필드는 shadow 사용을 뜻한다. /etc/shadow 예: $6$salt$hash에서 6은 SHA-512 crypt 방식 식별자다. 이는 단순 SHA-512 해시 그 자체와 구분한다.","② pam_pwquality.so의 lcredit/ucredit/dcredit/ocredit 음수값은 각 문자 종류의 최소 요구 개수를 나타낸다. 실제 정책 파일은 배포판과 PAM 구성에 따라 다르며 /etc/pam.d/system-auth나 password-auth, /etc/security/pwquality.conf 등을 확인한다.","③ pam_faillock 및 faillock.conf의 deny, unlock_time은 실패 임계 횟수와 잠금 시간 설정. PAM 연결이 되어야 효력이 난다.","④ 기본 수명 설정 PASS_MAX_DAYS는 새로 만드는 계정에 적용될 수 있으며 기존 계정은 chage -l 계정명으로 확인한다.","실기에서 /etc/passwd의 각 필드, /etc/shadow 해시 형식 및 PAM 모듈을 구분해 묻는 경우가 많다. /etc/passwd의 x는 shadow 파일 사용을 가리키며, /etc/shadow의 $6$은 SHA-512-crypt 식별자이다. 솔트는 같은 비밀번호라도 다른 해시가 생성되도록 하여 미리 계산된 해시표 공격 비용을 높인다. 인증 정책은 PAM 서비스 설정을 통해 실제 연결되어야 효력이 있다."],"example":"getent passwd alice\nsudo chage -l alice\nsudo faillock --user alice\n# /etc/security/faillock.conf 예\ndeny = 5\nunlock_time = 600\n# 배포판별 PAM 적용 여부 확인 필요","question":"리눅스에서 비밀번호 저장 위치, 계정 잠금 설정 방법, 솔트의 목적을 서술하시오.","answer":"/etc/passwd에는 계정·UID·GID·홈·로그인 셸 등 계정 정보가 저장되고, 보통 비밀번호 필드는 x로 표시되어 실제 비밀번호 검증용 해시와 만료 정보는 /etc/shadow에서 관리한다. 솔트는 각 계정의 해시 계산에 고유값을 섞어 같은 비밀번호의 해시 재사용과 레인보우 테이블 공격을 어렵게 한다. 실패 시 계정 잠금은 pam_faillock과 faillock.conf의 deny, unlock_time 등을 설정하고 해당 PAM 스택에 적용했는지 확인한다.","keywords":"passwd/shadow 구분, hash와 salt, PAM 적용, deny/unlock_time","pitfall":"최근 NIST SP 800-63B-4의 단일 요소 비밀번호 최소 15자 지침과 특정 기관의 기존 복잡도 규정을 혼동하면 안 된다.","sourceUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html","compact":"준비→탐지·분석→봉쇄→제거→복구→사후 검토. 조치 전 휘발성 데이터 우선 수집 여부 판단, 증거 원본 보존·이미징·해시 비교·인수인계 기록(Chain of Custody).","walk":[{"title":"계정 정보 저장 위치","body":"/etc/passwd는 사용자명, UID, GID, 홈, 로그인 셸 등의 정보다. 두 번째 필드 x는 비밀번호 해시가 보통 /etc/shadow에 별도 저장됨을 의미한다."},{"title":"해시 필드 구분","body":"/etc/shadow의 $id$salt$hash에서 id는 crypt 방법, salt는 같은 암호라도 다른 검증값을 만드는 데 기여하는 값, hash는 검증용 결과다. 복호화 가능한 평문 암호 저장과 다르다."},{"title":"권한과 정책의 연계","body":"UID 0인 계정은 특권 계정이므로 목록을 확인해야 한다. GID 0만으로 root와 같은 모든 권한을 얻지는 않는다. 그룹과 개별 권한은 구분한다."},{"title":"PAM 흐름 이해","body":"PAM은 auth, account, password, session의 네 관리 영역을 제공한다. pam_pwquality는 품질검사, pam_faillock은 실패 잠금 정책을 구현할 수 있으며 PAM 스택에 등록돼야 실제 적용된다."},{"title":"설정 명령과 검증","body":"faillock.conf의 deny, unlock_time 등을 확인하고 faillock 명령으로 상태를 살핀다. 배포판별 설정 파일 차이가 있으므로 반드시 활성 설정·실제 로그인 동작을 검증한다."}],"compactNotes":[{"title":"리눅스 패스워드","content":"/etc/passwd의 x→/etc/shadow에 해시 저장. $1=MD5, $5=SHA-256, $6=SHA-512(crypt 계열 식별자). PAM=인증·계정·비밀번호·세션 관리."}],"shortQuestion":{"question":"리눅스 shadow의 $6$ 식별자는 무슨 패스워드 해시 방식인가?","answer":"SHA-512-crypt","keywords":["SHA-512"]}},{"id":"linux-logs","n":12,"title":"로그 · 프로세스 조사 · 증거 보존","priority":2,"area":"01 시스템 보안","summary":"실무형은 어떤 파일을 조회하는지만 아니라 증거의 성격과 변조 가능성을 함께 써야 한다.","sourceDetails":["① who/w는 현재 로그인 정보를, last는 wtmp 기반 로그인 이력, lastb는 btmp 기반 실패 이력을 확인한다(배포판에 따라 다름). /var/log/auth.log 또는 /var/log/secure는 인증 관련 로그다.","② ps -ef·top은 실행 중인 프로세스, ss -lntp는 TCP 리스닝 포트와 프로세스 정보(권한에 따라 다름)를 확인한다. /proc/PID/cmdline은 NUL로 구분된 인수, /proc/PID/exe는 실행 파일 경로 링크이다.","③ 쉘 history는 명령 실행 사실의 유일한 증거가 아니다. 지울 수 있고 세션 저장 시점에 따라 누락될 수 있으므로 auditd·journal·쉘 로그 등과 교차검증한다.","④ 의심 파일은 원본을 직접 수정하지 말고 시간 기록, 해시값 계산, 적절한 획득 및 접근 통제를 수행한다.","포렌식 관점에서 단일 로그만으로 침해를 확정하면 안 된다. 인증 성공/실패, 프로세스, 포트, 파일 변경 시각, 네트워크 연결을 시간 순서로 교차 검증해야 한다. 프로세스 실행 파일이 삭제되어도 리눅스에서 해당 프로세스가 살아 있을 수 있으며 /proc/PID/exe 링크가 (deleted)로 보일 수 있다. history는 쉘 환경과 기록 시점에 따라 누락·변조 가능하다."],"example":"last | head\nlastb | head                # 권한 필요\nss -lntp                    # 리스닝 TCP 포트\nps -ef | grep suspicious\ntr \"\\0\" \" \" \u003c/proc/5900/cmdline\nreadlink /proc/5900/exe\nlsof -p 5900","question":"프로세스 5900번의 실행 파일이 삭제되었다고 표시된다. 확인할 자료와 분석 순서를 제시하시오.","answer":"먼저 대상 프로세스의 PID·부모 PID·실행 계정·시작 시각을 확인한다. /proc/5900/exe로 실행 파일 경로, /proc/5900/cmdline으로 실행 인자, lsof -p 5900으로 열린 파일, ss 또는 lsof -i로 네트워크 연결을 확인한다. 실행 파일이 삭제되었더라도 프로세스가 계속 실행 중일 수 있다. 관련 로그 및 휘발성 증거를 적절한 절차로 확보하고 파일·증거의 해시와 확보 시간을 기록한 후 확산 방지와 제거를 수행한다.","keywords":"프로세스 근거, /proc/PID, 연결·로그 연계, 증거보존","pitfall":"프로세스가 메모리에 있으므로 모든 경우 exe 링크로 원본 복원이 가능하다고 단정하지 않는다.","sourceUrl":"https://man7.org/linux/man-pages/man5/proc.5.html","compact":"IPsec AH=무결성·출처 인증·재전송 방지, 기밀성 없음. ESP=기밀성 및 무결성·인증(사용 구성에 따름). 전송 모드=상위 계층 페이로드 보호, 터널 모드=원래 IP 패킷 캡슐화. TLS 1.3=(EC)DHE/PSK 기반 키 교환·AEAD 사용.","walk":[{"title":"한 종류의 로그에 의존하지 않기","body":"history는 셸에서 실행한 명령 이력일 뿐이며 조작 또는 누락될 수 있다. 로그인, 프로세스, 소켓, 파일 변경, 서비스 로그를 시간대별로 함께 비교한다."},{"title":"명령어 역할 구분","body":"last는 wtmp의 로그인 이력, lastb는 btmp의 실패 로그인 이력, lsof는 열려 있는 파일·소켓, ss는 네트워크 소켓, ps는 프로세스 목록을 확인한다."},{"title":"/proc의 의미 파악","body":"/proc은 디스크에 실행 파일 복사본을 저장하는 폴더가 아니라 커널·프로세스 정보를 제공하는 가상 파일시스템이다. /proc/PID/exe와 cmdline으로 실행 파일 및 인자를 조사한다."},{"title":"삭제된 실행 파일 조사","body":"/proc/5900/exe가 (deleted)라고 표시돼도 프로세스가 살아 있을 수 있다. 이때 메모리·파일 디스크립터 관련 증거 확보 여부를 판단하고, 무턱대고 종료해 증거를 잃지 않도록 한다."},{"title":"서술형 답안 구성","body":"프로세스 PID·PPID·계정·시작시간을 기록하고, 실행 경로·명령 인자·열린 파일·외부 연결을 조사한 뒤 관련 로그를 교차 확인하고 해시·시각·수집자를 기록한다."}],"compactNotes":[{"title":"리눅스 로그·도구","content":"last=wtmp 로그인 이력, lastb=btmp 실패 이력, lastlog=최근 로그인, lsof=열린 파일, ss -tulpen=리스닝 포트, /proc/PID/cmdline=프로세스 실행 인자."}],"shortQuestion":{"question":"로그인 성공 이력, 실패 이력, 열린 파일을 확인하는 리눅스 명령어를 각각 쓰시오.","answer":"last, lastb, lsof","keywords":["last","lastb","lsof"]}},{"id":"tcp-ip","n":13,"title":"TCP 플래그 · 포트 · IP 단편화","priority":2,"area":"02 네트워크 보안","summary":"SYN Flood는 반개방 연결을 악용하고 IP Fragment Offset은 8바이트 단위로 표시한다.","sourceDetails":["① TCP 연결은 SYN→SYN/ACK→ACK. SYN Flood는 최종 ACK가 도착하지 않아 대기 자원이 고갈될 수 있다. SYN cookies, rate limiting, 장비 보호 등을 조합한다.","② TCP는 신뢰성 있는 스트림, UDP는 연결 설정 없이 데이터그램을 보내며 DNS는 일반 질의에서 UDP/53, 큰 응답·영역전송 등에서 TCP/53도 사용한다.","③ IPv4의 Fragment Offset은 8바이트 블록 단위. MTU 1500, IP 헤더 20바이트면 단편 데이터 1480바이트 → offset은 0,185,370으로 계산한다.","④ TTL은 라우터를 통과할 때 감소하므로 관측된 TTL만으로 운영체제를 확정할 수 없다.","TCP 연결 절차는 SYN → SYN/ACK → ACK이며, 연결을 종료할 때 FIN/ACK 교환 또는 RST가 사용될 수 있다. 패킷 분석에서는 방향, 순서 번호, 재전송, 플래그를 확인한다. 단편화 오프셋(IPv4)은 8바이트 단위이고 MF가 1이면 뒤에 단편이 남아 있다. 단편화가 곧 공격 증거는 아니지만 비정상 중첩·오프셋은 분석 포인트다."],"example":"TCP SYN=연결 시작, ACK=확인, FIN=정상 종료 요청, RST=연결 강제 초기화\nIPv4 Fragment Offset 예: 데이터 1480B씩 분할 시 0,185,370...\nIPv4 DF=1: 단편화 금지 / MF=1: 뒤 단편 존재","question":"1500바이트 MTU에서 IPv4 헤더가 20바이트일 때, 단편 데이터 1480바이트의 두 번째 단편 오프셋을 쓰시오.","answer":"IPv4 Fragment Offset 필드는 실제 바이트 위치를 8바이트 단위로 표시한다. 첫 번째 단편에 데이터 1480바이트를 담았다면 두 번째 단편의 시작 바이트는 1480이므로 오프셋은 1480/8=185다. 모든 단편은 같은 Identification 값을 사용하며 마지막 단편의 MF 값은 0이 된다.","keywords":"MTU-헤더=1480, offset /8=185, MF","pitfall":"IPv6에서는 라우터가 단편화하지 않고 송신 노드가 단편화를 관리한다.","sourceUrl":"https://www.rfc-editor.org/rfc/rfc791.html","compact":"/etc/passwd의 x→/etc/shadow에 해시 저장. $1=MD5, $5=SHA-256, $6=SHA-512(crypt 계열 식별자). PAM=인증·계정·비밀번호·세션 관리.","walk":[{"title":"TCP 세 단계 연결 이해","body":"클라이언트 SYN, 서버 SYN/ACK, 클라이언트 ACK가 3-way handshake다. SYN만 많고 ACK가 적으면 연결 고갈 공격을 의심할 단서가 된다."},{"title":"TCP 플래그 분류","body":"SYN은 연결 시작, ACK는 확인, FIN은 정상 종료 의사, RST는 연결 강제 종료를 의미한다. 플래그 한 개만 보고 공격을 확정해서는 안 된다."},{"title":"IPv4 단편화 조건 계산","body":"MTU 1500, IPv4 헤더 20바이트라면 한 단편에 담을 수 있는 최대 페이로드는 1480바이트다. 8바이트 배수여야 하는 단편 데이터의 조건도 확인한다."},{"title":"오프셋 필드 단위 변환","body":"Fragment Offset은 바이트 수가 아닌 8바이트 단위다. 2번째 단편이 1480바이트 뒤에서 시작한다면 1480÷8 = 185를 쓴다. 1480이라고 쓰면 틀린다."},{"title":"완성 답안과 플래그 연결","body":"식별자(Identification)는 같은 원본 데이터그램의 단편을 연관짓는다. MF=1은 뒤 단편 존재, 마지막 단편의 MF=0이다. 공격 사례에서는 비정상 단편 중첩·변형을 별도로 판단한다."}],"compactNotes":[],"shortQuestion":{"question":"IPv4에서 첫 단편이 1,480바이트의 데이터로 구성되었다면 두 번째 단편 Fragment Offset 값은?","answer":"185 (1480÷8)","keywords":["185"]}},{"id":"ipsec","n":14,"title":"IPsec AH/ESP · 전송/터널 모드","priority":2,"area":"02 네트워크 보안","summary":"ESP는 암호화(기밀성) 및 인증된 암호 운용 시 무결성과 인증을 제공한다. AH는 암호화를 제공하지 않는다.","sourceDetails":["① AH는 패킷 무결성·데이터 출처 인증·재전송 공격 방지 기능을 제공하나 기밀성은 없다. ESP는 기밀성을 제공하고 암호 모드/구성에 따라 무결성·출처 인증을 제공한다.","② 전송모드는 원래 IP 헤더를 유지하고 상위 페이로드를 보호한다. 터널모드는 원래 IP 패킷을 캡슐화하고 새로운 바깥 IP 헤더를 붙인다.","③ ESP 터널모드에서 보호되는 부분은 ESP 헤더, 암호화되는 내부 IP 패킷과 ESP trailer, 인증 태그를 구분해 그려야 한다.","④ IKEv2는 DH 기반 키 협상 및 SA 관리에 사용한다.","IPsec은 IP 계층에서 통신을 보호하는 프로토콜 모음이다. AH는 출처 인증·무결성·재전송 방지를 제공하지만 암호화를 통한 기밀성은 제공하지 않는다. ESP는 기밀성을 제공할 수 있고 인증·무결성도 선택한 알고리즘·구성에 따라 제공한다. 전송 모드는 원 IP 헤더를 유지하고 페이로드 부분을 보호하며, 터널 모드는 원 IP 패킷을 캡슐화하고 새 외부 IP 헤더를 추가한다."],"example":"ESP 터널(개략): 새 IP | ESP 헤더 | 원래 IP | TCP/UDP | 데이터 | ESP Trailer | ICV(사용 시)\n전송 모드: 원 IP 헤더 유지, 상위계층 보호\n터널 모드: 원래 IP 패킷 전체 캡슐화","question":"IPsec AH와 ESP의 차이, ESP 터널 모드의 암호화 영역을 설명하시오.","answer":"AH는 무결성과 패킷 출처 인증, 재전송 방지를 제공하지만 기밀성은 제공하지 않는다. ESP는 암호화를 통한 기밀성에 더해 설정에 따라 무결성·출처 인증을 제공한다. ESP 터널 모드에서는 새 외부 IP 헤더 뒤에 ESP 헤더가 놓이며, 원래 IP 패킷 전체(원 IP 헤더와 상위 계층 데이터) 및 ESP 트레일러가 암호화 대상이다. 새 외부 IP 헤더와 ESP 헤더는 암호화되지 않는다.","keywords":"AH=암호화 없음, ESP=암호화, 새/원래 IP 헤더 구분","pitfall":"ESP가 항상 무결성 보호를 제공한다고 가정하면 안 되며 사용한 알고리즘·구성을 명시한다.","sourceUrl":"https://www.rfc-editor.org/rfc/rfc4303.html","compact":"last=wtmp 로그인 이력, lastb=btmp 실패 이력, lastlog=최근 로그인, lsof=열린 파일, ss -tulpen=리스닝 포트, /proc/PID/cmdline=프로세스 실행 인자.","walk":[{"title":"IPsec가 보호하는 위치 확인","body":"IPsec는 IP 계층에서 통신을 보호한다. 두 주된 프로토콜 AH와 ESP는 보호 범위와 제공 기능이 다르므로 기밀성을 주는지부터 구별한다."},{"title":"AH의 기능 기억","body":"AH는 무결성, 데이터 출처 인증, 재전송 공격 방지 등을 제공하지만 데이터 기밀성을 위한 암호화는 제공하지 않는다. ‘AH는 암호화’라고 쓰면 감점 요인이다."},{"title":"ESP의 기능 기억","body":"ESP는 설정에 따라 기밀성 암호화와 무결성·인증 서비스를 제공할 수 있다. 보안 정책과 알고리즘 구성에 따라 실제 제공 기능을 확인한다."},{"title":"전송/터널 모드 구분","body":"전송 모드는 기본적으로 원래 IP 헤더를 유지하며 IP 페이로드를 보호한다. 터널 모드는 원래 IP 패킷을 새로운 외부 IP 패킷 안에 캡슐화한다."},{"title":"암호화 범위를 도식으로 설명","body":"ESP 터널 모드에서는 원래 IP 헤더와 원래 페이로드가 암호화 범위에 포함되고 새로 붙인 외부 IP 헤더는 포함되지 않는다. 장비 간 VPN에서는 터널 모드가 사용될 수 있다."}],"compactNotes":[{"title":"IPsec·TLS","content":"IPsec AH=무결성·출처 인증·재전송 방지, 기밀성 없음. ESP=기밀성 및 무결성·인증(사용 구성에 따름). 전송 모드=상위 계층 페이로드 보호, 터널 모드=원래 IP 패킷 캡슐화. TLS 1.3=(EC)DHE/PSK 기반 키 교환·AEAD 사용."}],"shortQuestion":{"question":"IPsec AH와 ESP 중 기밀성 암호화를 제공하지 않는 것은?","answer":"AH","keywords":["AH"]}},{"id":"arp-dns","n":15,"title":"ARP 스푸핑 · DNS 보안 · 이메일 인증","priority":2,"area":"02 네트워크 보안","summary":"ARP는 로컬 IP-MAC 대응, DNSSEC은 DNS 응답 진위 보호, SPF/DKIM/DMARC는 이메일 발신 도메인 보호이다.","sourceDetails":["① ARP 스푸핑은 위조 ARP 응답으로 IP-MAC 매핑을 변조해 중간자 공격을 유발한다. DHCP Snooping과 연계한 DAI(Dynamic ARP Inspection) 같은 네트워크 장비 보호를 고려한다.","② DNS 캐시 포이즈닝은 잘못된 레코드를 캐시에 저장시켜 악성 목적지로 유도한다. DNSSEC은 DNS 데이터의 출처 인증·무결성을 제공하지만 응답 암호화나 DDoS 방어를 보장하지 않는다.","③ SPF는 발송 IP가 해당 Envelope-from 도메인의 정책에 부합하는지, DKIM은 메시지에 대한 도메인 서명을, DMARC는 표시된 From 도메인의 정렬(alignment)과 정책(p=none/quarantine/reject) 및 보고를 다룬다.","ARP 스푸핑은 같은 LAN에서 IP-MAC 대응을 위조해 트래픽을 공격자에게 우회시키는 공격이며, DNS 캐시 포이즈닝은 DNS 응답과 캐시를 오염시켜 잘못된 IP로 접속하게 만든다. 스푸핑은 계층·대상·대응책을 구분해야 한다. DNS 서버의 재귀 허용 대상·영역전송 허용 대상은 최소화하고 DNSSEC 검증을 적용하면 위조 응답 위험을 완화할 수 있다."],"example":"arp -a / ip neigh       # ARP 캐시 확인\n/etc/resolv.conf          # DNS 클라이언트 리졸버 설정\n/etc/named.conf           # BIND 서버 설정의 대표적 경로\ndig example.org A\ndig @server example.org AXFR  # 권한 없는 실제 대상에는 실행 금지","question":"ARP 스푸핑과 DNS 캐시 포이즈닝의 차이를 설명하고 각각의 대응 방안을 두 가지씩 쓰시오.","answer":"ARP 스푸핑은 로컬 네트워크의 IP-MAC 매핑을 허위 응답으로 바꿔 통신을 가로채거나 중간자 공격을 수행한다. DHCP Snooping과 연계한 Dynamic ARP Inspection, 정적 ARP(관리 가능한 범위), 네트워크 분리 등을 적용한다. DNS 캐시 포이즈닝은 DNS 리졸버가 위조 DNS 응답을 캐시에 저장하도록 하여 잘못된 주소를 반환하게 만드는 공격이다. DNSSEC 응답 검증, 안전한 리졸버 구성, 재귀·영역전송 제한 등을 적용한다.","keywords":"ARP=IP-MAC, DNS=이름-IP, 스위치·DNS별 완화","pitfall":"SPF 통과만으로 사용자가 본 From 도메인 사칭이 방지되는 것은 아니다.","sourceUrl":"https://www.rfc-editor.org/rfc/rfc7489.html","compact":"named.conf=BIND DNS 서버 설정·zone 지정, resolv.conf=클라이언트 DNS 검색 설정. 캐시 포이즈닝=위조된 DNS 응답으로 잘못된 IP를 캐시에 저장. Zone Transfer·재귀 질의 대상을 제한.","walk":[{"title":"ARP와 DNS의 역할","body":"ARP는 같은 네트워크에서 IPv4 주소와 MAC 주소의 대응을 알아내고 DNS는 도메인 이름을 IP 주소로 해석한다. 서로 다른 계층과 저장 구조를 공격한다."},{"title":"ARP 스푸핑의 방향","body":"동일 LAN에서 거짓 ARP 응답을 보내 게이트웨이 IP가 공격자의 MAC으로 매핑되도록 만들면 피해자의 트래픽이 공격자를 거칠 수 있다."},{"title":"DNS 캐시 포이즈닝의 방향","body":"리졸버에 위조된 DNS 응답을 저장시키면 정상 도메인을 조회했을 때 공격자가 의도한 IP가 반환될 수 있다. DNS 응답과 캐시 무결성이 핵심이다."},{"title":"대응 방안을 정확하게 연결","body":"ARP 쪽에는 DAI·DHCP Snooping 연계·세그먼트 격리 등, DNS에는 DNSSEC 검증·안전한 리졸버 설정·재귀 및 영역전송 제한 등을 적용한다."},{"title":"파일·명령어를 답안에 넣기","body":"/etc/resolv.conf는 일반적인 클라이언트 리졸버 설정이며 named.conf는 BIND 서버 설정에 쓰인다. dig는 DNS 질의, arp/ip neigh는 ARP 테이블 조회에 사용할 수 있다."}],"compactNotes":[{"title":"DNS 설정·공격","content":"named.conf=BIND DNS 서버 설정·zone 지정, resolv.conf=클라이언트 DNS 검색 설정. 캐시 포이즈닝=위조된 DNS 응답으로 잘못된 IP를 캐시에 저장. Zone Transfer·재귀 질의 대상을 제한."}],"shortQuestion":{"question":"BIND DNS 서버 설정 파일과 일반적인 리눅스 DNS 클라이언트 설정 파일은?","answer":"named.conf, resolv.conf","keywords":["named.conf","resolv.conf"]}},{"id":"auth-sessions","n":16,"title":"인증·인가 · 세션관리 · OAuth/OIDC","priority":2,"area":"03 애플리케이션 보안","summary":"인증은 누군지 확인, 인가는 어떤 행위를 할 수 있는지 판단. OAuth 2.0은 인가, OIDC는 OAuth 2.0 기반 인증 계층이다.","sourceDetails":["① 로그인 성공 후 발급되는 세션 식별자는 예측 불가능하게 만들고 로그인·권한 상승 시 재발급해야 한다. 서버측 세션 만료·로그아웃 무효화를 적용한다.","② 수평 권한 상승(IDOR/BOLA)은 다른 이용자의 객체 식별자로 조회/변경하는 취약점으로, 서버가 요청마다 주체-대상 자원 관계를 확인해야 한다.","③ OAuth 2.0 액세스 토큰은 API 접근 권한을 나타내며 OIDC의 ID Token은 인증 결과·사용자 정보를 표현한다. OAuth의 state는 CSRF 완화, OIDC nonce는 토큰 재사용 등 특정 위험 완화에 사용한다.","인증(Authentication)은 누구인지 확인하는 과정, 인가(Authorization)는 어떤 자원·기능을 사용할 수 있는지 결정하는 과정이다. IDOR는 인증 여부와 상관없이 객체 수준 권한 검사를 빠뜨려 다른 사용자의 정보에 접근하는 문제다. OAuth 2.0은 인가 프레임워크이고 OpenID Connect(OIDC)는 그 위에서 신원 확인 기능을 제공한다."],"example":"/api/orders/123 → /api/orders/124 변경 시 소유자 검증 필요\n쿠키: Secure / HttpOnly / SameSite 적용\nOAuth2: 액세스 토큰으로 API 권한 위임\nOIDC: ID 토큰 등으로 사용자 신원 확인","question":"로그인한 A 사용자가 URL 번호를 바꿔 B의 주문서를 조회했다. 취약점과 서버 측 대응을 설명하시오.","answer":"사용자가 인증되었더라도 주문서 124번에 대한 접근 권한이 있는지 서버가 확인하지 않아 다른 사용자의 자료를 조회한 사례이므로 객체 수준 권한검사 누락(IDOR/BOLA)이다. 각 요청마다 자원의 소유자 또는 역할 기반 허가 정책을 검증하고, 단순히 화면에서 버튼을 숨기거나 번호를 난수화하는 방식만으로 보호하지 않는다. 관리자 기능은 별도 역할·권한을 검증하고 접근 실패를 기록한다.","keywords":"인가 누락, 객체별 권한 확인, 서버 검사, UI 제한 불충분","pitfall":"UI 버튼 숨김이나 JWT 서명 검증만으로 리소스 인가가 완료되지 않는다.","sourceUrl":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html","compact":"SIEM=로그 수집·상관 분석·경보, SOAR=탐지·분석 후 플레이북 자동화, EDR=엔드포인트 행위 탐지·대응, DLP=민감정보 유출 차단, WAF=HTTP 계층 웹공격 필터링.","walk":[{"title":"인증과 인가를 분리","body":"인증(Authentication)은 누구인지 확인하고 인가(Authorization)는 무엇을 할 수 있는지 판단한다. 로그인에 성공해도 관리자 기능에 대한 권한을 별도로 확인해야 한다."},{"title":"세션 고정·탈취를 이해","body":"세션 식별자를 탈취하거나 미리 정한 세션을 피해자에게 사용시키면 공격자가 인증 상태를 악용할 수 있다. 로그인 후 세션 ID 재발급, 안전한 쿠키 설정과 만료 정책이 필요하다."},{"title":"OAuth 2.0 용도를 이해","body":"OAuth 2.0은 사용자가 특정 자원에 대한 접근 권한을 클라이언트에 위임하는 인가 프레임워크다. OAuth만으로 로그인 인증의 모든 조건을 자동 보장하지 않는다."},{"title":"OIDC와 구별","body":"OIDC는 OAuth 2.0 위에 사용자 인증 정보와 ID Token 등을 정의한 인증 계층이다. 로그인 기능을 설계할 때 접근 토큰과 ID 토큰의 목적을 혼동하지 않는다."},{"title":"방어를 답안에 반영","body":"각 요청에서 서버 측 인가 검사, 최소권한, 안전한 세션 처리, MFA, 비정상 로그인 탐지 등을 제시한다. UI 버튼 숨기기만으로 접근권한이 보호되는 것은 아니다."}],"compactNotes":[],"shortQuestion":{"question":"OAuth 2.0과 OpenID Connect(OIDC)의 핵심 목적을 구분하시오.","answer":"OAuth 2.0=인가·권한 위임, OIDC=사용자 인증 계층","keywords":["인가","인증"]}},{"id":"tls-crypto","n":17,"title":"TLS 1.3 · 암호·해시·전자서명","priority":2,"area":"04 정보보호일반","summary":"TLS 1.3은 AEAD 방식과 (EC)DHE/PSK 등을 사용한다. 암호화·해시·전자서명의 제공 보안 서비스를 구분한다.","sourceDetails":["① 대칭키 암호는 같은 키로 암·복호화하며 AES-GCM 등의 AEAD는 기밀성과 무결성 검증을 함께 제공한다.","② 공개키 암호는 공개키/개인키 쌍을 사용한다. 전자서명은 서명자 개인키로 서명하고 대응 공개키로 검증해 무결성과 서명 주체 검증에 기여한다.","③ 해시는 임의 길이 입력을 고정 길이 출력으로 요약하지만 복호화 기능은 없다. 패스워드는 소금값과 느린 비밀번호 해시 알고리즘을 사용한다.","④ TLS 1.3은 구형 RSA 키 전달을 폐지하고 키 교환에 (EC)DHE 또는 PSK를 사용하며 AEAD를 적용한다. 서버 인증서는 신뢰 사슬과 호스트명·유효기간을 검사해야 한다.","대칭키 암호는 같은 비밀키로 암·복호화하며 빠르지만 키 공유가 과제다. 공개키 암호는 서로 다른 키를 사용하며 키 교환·서명 등에 활용한다. 해시는 임의 길이 입력을 고정 길이 다이제스트로 바꾸는 함수이지 복호 가능한 암호문을 만드는 기법이 아니다. TLS 1.3에서는 주로 (EC)DHE/PSK 기반 키 합의와 AEAD 암호를 사용한다."],"example":"전자서명: 개인키 서명 → 공개키 검증\nTLS 1.3: (EC)DHE 및/또는 PSK → 키 파생 → AEAD로 기록 보호\n0-RTT: 재연결 최적화, 재생 공격 위험에 주의\n패스워드 저장: salt + 전용 느린 패스워드 해시(KDF)","question":"TLS 1.3에서 0-RTT의 장점과 주의점을 설명하고 전자서명의 보안 기능을 쓰시오.","answer":"0-RTT는 이전 연결로 공유된 PSK를 이용하여 전체 핸드셰이크가 완료되기 전에 초기 애플리케이션 데이터를 보낼 수 있어 지연을 줄인다. 그러나 초기 데이터는 연결 간 재생 공격에 대한 보장이 약하므로 결제 등 상태를 변경하는 작업에 신중히 적용한다. 전자서명은 서명자의 개인키로 서명하고 공개키로 검증하여 무결성과 서명자 인증을 제공하며, 키 신뢰성·절차가 충족되면 부인방지에 활용할 수 있다.","keywords":"PSK, 초기 데이터, replay 위험, 개인키/공개키, 무결성","pitfall":"TLS 1.3의 0-RTT 초기 데이터에는 재전송 공격 등 제약이 있으므로 멱등 작업 여부를 고려한다.","sourceUrl":"https://www.rfc-editor.org/rfc/rfc8446.html","compact":"UAC=관리자 권한 실행 통제. net share=공유 목록, net session=접속 세션. 4624=로그온 성공, 4625=실패, 4688=프로세스 생성(감사 설정 필요), 1102=보안 로그 삭제 이벤트.","walk":[{"title":"세 보안 목적부터 정리","body":"기밀성은 내용을 숨기는 것, 무결성은 변조를 감지하는 것, 인증은 상대방 또는 출처를 확인하는 것이다. 해시만으로 기밀성이 생기지는 않는다."},{"title":"대칭키·공개키 차이","body":"대칭키 암호는 같은 비밀키로 암복호화를 수행해 빠르게 대량 데이터 보호에 사용된다. 공개키 방식은 한 쌍의 키를 사용하며 키 교환·서명 등에 활용된다."},{"title":"전자서명의 방향","body":"서명자는 자신의 개인키로 서명하고 검증자는 해당 공개키로 검증한다. 메시지 무결성과 서명자 인증에 기여하되 서명만으로 본문 내용을 숨기지는 않는다."},{"title":"TLS 1.3 연결 개요","body":"ClientHello 등으로 지원 기능·키 공유 정보를 교환하고 (EC)DHE 또는 PSK 등을 이용해 공유 비밀과 암호키를 파생한다. 이후 AEAD로 애플리케이션 데이터를 보호한다."},{"title":"구형 TLS 설명과 구별","body":"구형 TLS의 RSA 키 전달 방식(사전 비밀을 서버 공개키로 암호화)과 TLS 1.3의 키 합의를 혼동하면 안 된다. TLS 1.3은 정적 RSA 키 전달을 사용하지 않는다."}],"compactNotes":[{"title":"암호·서명","content":"대칭키=암·복호에 같은 키. 공개키 암호=키 쌍 사용. 전자서명=개인키로 서명, 공개키로 검증(무결성·서명자 인증 등). 해시=고정 길이 다이제스트, 암호화와 구별."}],"shortQuestion":{"question":"전자서명 생성과 검증에 각각 사용하는 키는?","answer":"개인키로 서명, 공개키로 검증","keywords":["개인키","공개키"]}},{"id":"windows-evidence","n":18,"title":"Windows 이벤트 · 자격증명 · 포렌식","priority":1,"area":"01 시스템 보안","summary":"로그온 성공/실패, 프로세스 생성, LSASS 접근을 함께 분석해야 침해 흐름을 설명할 수 있다.","sourceDetails":["① Windows Security Event ID 4624는 로그온 성공, 4625는 로그온 실패이며 로그온 유형·계정·출발지 주소·시간을 함께 봐야 한다. 4688은 감사 정책에 따라 프로세스 생성 이벤트를 기록한다.","② Sysmon은 추가 구성 시 프로세스 생성 Event ID 1, 네트워크 연결 3, 프로세스 접근 10 등 풍부한 원격 조사 정보를 제공한다.","③ NTLM Pass-the-Hash는 탈취한 NT 해시를 이용해 인증 과정을 통과하려는 공격으로, 일반적인 비밀번호 재입력이나 단순 해시 송신 설명과 구분해야 한다.","④ LSASS 메모리 접근 징후는 정상 백신/보안도구의 접근과 함께 구분해야 하며 비정상 부모 프로세스, 접근 권한, 생성된 덤프 파일을 상관분석한다.","Windows는 Security 이벤트 로그만으로 사건을 전부 설명하기 어렵다. 로그온 유형(대화형·네트워크·원격 대화형 등), IP, 사용자, 시간, 프로세스 생성, 지속성 레지스트리/작업 스케줄러를 함께 확인한다. Sysmon 이벤트는 설치·설정된 환경에서만 수집된다. NTLM 해시의 불법 재사용(Pass-the-Hash)과 단순한 비밀번호 추측을 구별한다."],"example":"4624: 로그인 성공   | 4625: 로그인 실패\n4688: 프로세스 생성(감사 정책 필요)\n1102: 보안 감사 로그 삭제\nSysmon ID 1: 프로세스 생성\nSysmon ID 3: 네트워크 연결(설정된 경우)","question":"4625 실패가 다량 발생한 뒤 4624 성공, 이후 4688 비정상 명령 실행 기록이 발견되었다. 가능한 침해 흐름과 확인 항목을 쓰시오.","answer":"로그온 실패가 반복된 후 같은 사용자 또는 출발지에서 성공이 발생하고 비정상 프로세스가 실행되었다면 비밀번호 공격 후 계정 악용을 의심할 수 있다. 4625/4624의 계정·IP·로그온 유형·시간을 비교하고 4688의 실행 파일·명령행·부모 프로세스를 확인한다. 해당 호스트의 EDR·Sysmon, 파일 및 네트워크 로그와 대조해 실제 공격 여부를 판단하며 4624 성공만으로 침해를 단정하지 않는다.","keywords":"4625→4624→4688 상관관계, 로그온 유형, 추가 증거, 단정 금지","pitfall":"4624 한 건만으로 계정 탈취를 확정할 수 없고, 이벤트가 없는 것도 수집 정책에 따라 정상일 수 있다.","sourceUrl":"https://attack.mitre.org/techniques/T1003/001/","compact":"DAC=객체 소유자가 권한 관리, MAC=보안 등급·정책 기반 강제 접근제어, RBAC=역할별 권한 부여. 최소 권한·직무분리·기본거부를 답안에 함께 기재.","walk":[{"title":"이벤트 ID를 시간순 배치","body":"4625는 로그인 실패, 4624는 성공, 4688은 프로세스 생성, 1102는 보안 감사로그 삭제를 나타낸다. 감사 정책이 활성화되어야 일부 이벤트가 남는다."},{"title":"로그온 실패 뒤 성공 해석","body":"특정 IP에서 같은 사용자에게 다량의 4625가 기록되고 이어 4624가 발생하면 무차별 대입 후 성공 등 가능성을 조사할 수 있다. 성공 이벤트 하나만으로 침해 확정은 불가하다."},{"title":"프로세스 행위를 연계","body":"4688의 실행 파일, 명령행(감사 설정), 부모 프로세스와 실행 계정을 확인한다. EDR·Sysmon 설치 여부에 따라 추가 네트워크·파일 실행 증거를 활용한다."},{"title":"자격증명 공격 구별","body":"Pass-the-Hash는 NTLM 해시를 인증 재료로 불법 재사용하는 공격이며 단순히 비밀번호를 추측하는 것과 다르다. 관련 인증·네트워크 로그를 함께 살핀다."},{"title":"완성 답안 구조","body":"실패→성공→프로세스 실행 순서로 의심 시나리오를 제시하고 IP·계정·로그온 유형·추가 증거를 비교한 뒤 초기 차단 및 로그 보존 계획을 적는다."}],"compactNotes":[{"title":"Windows 보안","content":"UAC=관리자 권한 실행 통제. net share=공유 목록, net session=접속 세션. 4624=로그온 성공, 4625=실패, 4688=프로세스 생성(감사 설정 필요), 1102=보안 로그 삭제 이벤트."}],"shortQuestion":{"question":"Windows 보안 이벤트 4624, 4625, 4688의 의미는?","answer":"4624=로그온 성공, 4625=로그온 실패, 4688=프로세스 생성","keywords":["4624","4625","4688"]}},{"id":"isms","n":19,"title":"ISMS-P 관리체계 · 위험평가 · 인증 요구사항","priority":1,"area":"05 정보보호관리 및 법률","summary":"정보보호관리체계를 조직의 정책·조직·자산관리·위험평가·통제·점검·개선으로 운영하는 인증체계다.","sourceDetails":["① ISMS-P 인증기준은 관리체계 수립 및 운영 16개, 보호대책 요구사항 64개, 개인정보 처리단계별 요구사항 21개로 총 101개이다. ② 관리체계는 기반 마련 → 위험관리 → 운영 → 점검 및 개선의 순환구조로 이해한다. ③ 보호대책에는 인적·물리적 보안, 접근통제, 암호화, 개발보안, 사고대응, 재해복구 등이 포함된다. ④ 개인정보 처리단계 요구사항은 수집, 보유·이용, 제공, 파기, 정보주체 권리보호 등으로 구분된다.","ISMS-P의 인증기준은 총 101개이며, 현재 공식 안내 기준 16·64·21 항목으로 나뉜다. 실기에서는 항목 수를 단답형으로 묻거나 위험평가·보호대책 구현·점검 절차를 서술하게 할 수 있다. 운영에서 경영진의 책임, 범위 설정, 자산 식별, 위협·취약점 식별, 위험 처리와 이행 증적이 중요하다."],"example":"관리체계 수립 및 운영 16개\n보호대책 요구사항 64개\n개인정보 처리단계별 요구사항 21개\n합계 101개\n운영: 기반 마련 → 위험관리 → 운영 → 점검·개선","question":"ISMS-P의 인증기준 구성과 위험관리 절차가 인증체계에서 중요한 이유를 설명하시오.","answer":"ISMS-P는 관리체계 수립·운영 16개, 보호대책 요구사항 64개, 개인정보 처리단계별 요구사항 21개 등 총 101개 인증기준으로 구성된다. 조직은 관리체계의 범위와 정책·조직·자산을 정하고 위험을 식별·분석·평가해 필요한 보호대책을 선정·구현한다. 이후 운영 증적을 확인하고 점검·개선을 반복함으로써 보안활동을 일회성 조치가 아닌 지속적 관리체계로 운영한다.","keywords":"16·64·21·101, 기반→위험→운영→개선, 지속 관리","pitfall":"인증 획득이 모든 사고를 방지하거나 법규 준수를 자동 보증한다는 뜻은 아니다.","sourceUrl":"https://www.isms-p.or.kr/sysm/intro/selectSysmCertDetail.do","compact":"대칭키=암·복호에 같은 키. 공개키 암호=키 쌍 사용. 전자서명=개인키로 서명, 공개키로 검증(무결성·서명자 인증 등). 해시=고정 길이 다이제스트, 암호화와 구별.","walk":[{"title":"개념을 한 문장으로 정의","body":"ISMS-P는 조직이 정보보호·개인정보보호 관리체계를 수립·운영하는 것을 일정 기준에 따라 인증하는 제도다. 인증 취득과 법적 의무의 전부 이행은 같은 뜻이 아니다."},{"title":"101개 구성을 분리","body":"관리체계 수립 및 운영 16개, 보호대책 요구사항 64개, 개인정보 처리단계별 요구사항 21개다. 합계 101개를 단순히 외우지 말고 어느 영역인지 구분한다."},{"title":"위험관리와 연결","body":"자산 식별→위험 식별·분석·평가→보호대책 선정·적용→운영 증적 확보 과정을 지속적으로 수행한다."},{"title":"평가·개선으로 순환","body":"경영진 책임, 내부감사, 개선조치, 인적·물리적·기술적 보호대책 점검을 반복해 관리체계의 실효성을 높인다."},{"title":"서술형 작성 방법","body":"제도 목적과 항목 구성을 먼저 쓰고, 위험분석·대책·점검·개선의 흐름을 조직 운영 사례와 연결해 설명한다. 수치만 적는 답보다 절차를 함께 서술한다."}],"compactNotes":[{"title":"정보보호 관리·ISMS-P","content":"정책 수립→위험 평가→보호대책 구현→점검·개선(PDCA). ISMS-P=정보보호 및 개인정보보호 관리체계 인증. 인증과 법적 안전조치 의무는 구분."}],"shortQuestion":{"question":"ISMS-P 인증기준의 세 영역별 항목 수와 전체 합계는?","answer":"관리체계 16, 보호대책 64, 개인정보 처리단계별 21, 총 101개","keywords":["16","64","21","101"]}},{"id":"access-model","n":20,"title":"DAC · MAC · RBAC · 최소권한 · 직무분리","priority":1,"area":"05 정보보호관리 및 법률","summary":"접근통제는 주체가 객체에 어떤 행위를 할 수 있는지 결정한다. DAC·MAC·RBAC는 결정 주체와 기준이 다르다.","sourceDetails":["① DAC(임의적 접근통제)는 객체 소유자가 접근권한을 결정한다. ② MAC(강제적 접근통제)은 중앙 정책과 보안등급에 따라 권한을 제한하며 사용자가 임의로 변경하기 어렵다. ③ RBAC(역할 기반 접근통제)은 업무 역할과 권한을 매핑해 관리한다. ④ 최소권한은 업무에 꼭 필요한 권한만 부여하고, 직무분리는 단일 사용자가 중요 업무의 모든 단계를 통제하지 못하게 한다. ⑤ ACL은 특정 객체에서 누가 어떤 권한을 갖는지 기록한 목록이다.","실제 시스템에서는 자원의 소유자·보안등급·역할이 결합되는 경우도 있으므로 하나의 모델만 존재한다고 단정하지 않는다. RBAC에서는 역할 설계와 권한 검토가 중요하고, 승인자와 수행자를 분리하면 내부자 오남용을 줄일 수 있다. ABAC(속성 기반)는 사용자·자원·환경 속성에 따라 동적으로 결정한다."],"example":"DAC: 파일 소유자가 타 사용자 접근을 승인\nMAC: 비밀 등급(예: 기밀/대외비)에 따라 정책상 통제\nRBAC: 회계 담당/승인자/감사자 역할별 권한 분리\n최소권한 + 직무분리 + 정기적인 권한 재검토","question":"근무자가 작성한 지출결의서를 동일인이 승인하지 못하게 하고 직급·담당 업무별로 권한을 관리하려 한다. 적용할 모델과 원칙은?","answer":"업무 역할에 권한을 연결하는 RBAC가 적합하다. 지출결의 작성·승인·감사 역할을 분리해 한 사람이 모든 단계를 단독으로 완료하지 못하게 하는 직무분리 원칙을 적용한다. 각 역할에는 필요한 최소권한만 부여하고 인사이동·퇴직 시 즉시 조정한다. 중요 결재와 데이터 접근은 별도의 이력 로그를 남기고 정기적으로 권한 적정성을 검토한다.","keywords":"RBAC, 역할 분리, 최소권한, 접근기록·정기검토","pitfall":"ACL과 접근통제 행렬을 혼동하지 않는다. MAC은 단순히 관리자만 관리한다는 설명보다 정책·보안등급을 강조한다.","sourceUrl":"https://csrc.nist.gov/glossary/term/role_based_access_control","compact":"BCP=핵심 업무 지속 계획, DRP=재해 발생 후 IT 복구 계획. RTO=허용 가능한 복구 목표 시간, RPO=허용 가능한 데이터 손실 시점 간격. 복구 우선순위·백업·훈련 연계.","walk":[{"title":"사용자가 권한을 정하는가","body":"DAC는 객체의 소유자 등이 접근권한을 재량적으로 부여하는 모델이다. 운영체제 파일 ACL의 일반적인 권한 부여를 예로 들 수 있다."},{"title":"정책이 강제하는가","body":"MAC은 주체의 보안등급과 객체의 분류·보안정책에 따라 중앙에서 강제한다. 개별 사용자가 임의로 등급을 낮춰 권한을 줄 수 없다."},{"title":"역할에 부여하는가","body":"RBAC는 개인이 아니라 직무·역할에 권한을 연결한다. 입사·부서 이동 시 역할을 바꾸면 관련 권한이 관리된다."},{"title":"직무분리와 최소권한","body":"결재 작성자와 승인자를 분리하고, 각 역할에 필요한 최소 권한만 부여한다. 한 사람이 생성·승인·감사를 모두 수행하지 않도록 한다."},{"title":"시험 사례에서 결론","body":"직책 변경이 잦은 조직의 승인 시스템이라면 RBAC+최소권한+직무분리가 핵심이다. MAC과 DAC의 특징도 대비해 설명한다."}],"compactNotes":[{"title":"접근통제 모델","content":"DAC=객체 소유자가 권한 관리, MAC=보안 등급·정책 기반 강제 접근제어, RBAC=역할별 권한 부여. 최소 권한·직무분리·기본거부를 답안에 함께 기재."}],"shortQuestion":{"question":"DAC·MAC·RBAC를 한 문구씩 구별하시오.","answer":"DAC=소유자 재량, MAC=강제 정책/등급, RBAC=역할별 권한","keywords":["DAC","MAC","RBAC"]}},{"id":"linux-ssh","n":21,"title":"SSH · 서비스 관리 · 최소 노출","priority":1,"area":"01 시스템 보안","summary":"SSH 서버 노출 최소화, 관리자 직접 접속 금지, 키 기반 인증과 사용 계정 제한을 함께 고려한다.","sourceDetails":["① sshd_config 예: PermitRootLogin no, PasswordAuthentication no(키 배포와 대체 접속 경로 확인 후). AllowUsers로 허용 계정을 제한할 수 있다.","② 적용 전에 sshd -t로 구문 검사를 하고 systemctl reload sshd 또는 배포판 서비스명을 확인한다.","③ 방화벽 제한, MFA/접근 경로 통제, 로그인 실패 모니터링을 병행한다. 특정 설정을 무작정 끄면 관리자 접속이 차단될 수 있으므로 대체 세션을 유지한다.","SSH는 평문 텔넷을 대체하는 원격 관리 프로토콜이다. root 직접 로그인 제한, 공개키 인증, 특정 계정 허용, 관리 대역 ACL은 서로 다른 통제다. PasswordAuthentication no를 적용하기 전에 정상적인 공개키 인증과 비상 접속 수단을 반드시 검증한다. 관리자 접근을 막아버리는 설정 사고가 실제 운영에서 빈번하다."],"example":"# /etc/ssh/sshd_config 예시\nPermitRootLogin no\nPasswordAuthentication no\nAllowUsers secadmin\n# 시험·적용 전 구문 검사\nsshd -t\nsystemctl reload sshd     # 배포판에 따라 ssh","question":"SSH에서 root 직접 접속을 제한하고 비밀번호 로그인을 중단하는 설정과 운영상 주의점을 제시하시오.","answer":"/etc/ssh/sshd_config에 PermitRootLogin no로 root 계정의 직접 SSH 로그인을 금지하고, 키 기반 인증이 정상 작동하는 것을 확인한 뒤 PasswordAuthentication no를 설정한다. AllowUsers로 접근 가능한 계정을 제한하고 관리망 접근통제를 추가한다. sshd -t로 설정 문법을 검증한 뒤 서비스를 reload하고 다른 세션으로 정상 접속을 확인한다.","keywords":"설정 파일, PermitRootLogin, PasswordAuthentication, 문법 검증, 대체 접속","pitfall":"배포판과 OpenSSH 버전·Match 블록에 따른 설정 우선순위를 점검한다.","sourceUrl":"https://man.openbsd.org/sshd_config","compact":"정책 수립→위험 평가→보호대책 구현→점검·개선(PDCA). ISMS-P=정보보호 및 개인정보보호 관리체계 인증. 인증과 법적 안전조치 의무는 구분.","walk":[{"title":"왜 SSH를 쓰는지","body":"SSH는 원격 관리 통신을 암호화하고 서버 인증 등을 제공한다. 텔넷처럼 인증정보를 평문 전송하는 서비스는 보호가 필요한 환경에 부적합하다."},{"title":"위험한 기본 접근 구분","body":"관리자 root 직접 로그인, 모든 출발지 접속 허용, 비밀번호 무차별 대입 등이 위험을 높일 수 있다. 접근 가능한 계정과 출발지 네트워크를 최소화한다."},{"title":"구체적인 sshd 설정","body":"sshd_config에서 PermitRootLogin no, 필요 시 키 기반 인증 검증 후 PasswordAuthentication no, AllowUsers 등 계정 제한을 적용한다."},{"title":"접속 중단 사고 예방","body":"기존 연결을 유지하면서 sshd -t로 문법을 검사하고 재로드 후 별도 세션에서 로그인 성공을 확인한다. 키 인증이나 예비접속 경로 검증 없이 암호 로그인을 먼저 끄면 관리자가 잠길 수 있다."},{"title":"작업형 답안 순서","body":"설정 파일 경로 → 옵션과 의미 → 검사 명령 → 서비스 반영 → 접속 검증 → 롤백 가능성 순으로 적으면 실무형 답안이 완성된다."}],"compactNotes":[],"shortQuestion":{"question":"sshd에서 root 직접 로그인을 금지하는 설정 한 줄을 쓰시오.","answer":"PermitRootLogin no","keywords":["PermitRootLogin","no"]}},{"id":"owasp25","n":22,"title":"OWASP Top 10:2025 · 공급망·오류처리","priority":1,"area":"03 애플리케이션 보안","summary":"2025 버전은 A01 접근통제 실패, A02 보안 설정 오류, A03 공급망 실패, A10 부적절한 예외처리를 포함한다.","sourceDetails":["① A01 Broken Access Control은 사용자에게 허용되지 않은 자원·기능 접근을 막지 못하는 문제다. IDOR/BOLA, 서버측 권한 누락 등을 포함한다.","② A03 Software Supply Chain Failures는 단순히 오래된 라이브러리를 사용하는 것뿐 아니라 서드파티 의존성·빌드·배포 경로가 침해되는 위험을 포괄한다. SBOM, 잠금 파일, 신뢰된 저장소, 서명/무결성 검증 등이 대응이다.","③ A09 Security Logging \u0026 Alerting Failures는 로그 수집뿐 아니라 경고가 후속 조치로 연결되지 않는 문제까지 포함한다.","④ A10 Mishandling of Exceptional Conditions는 예외 상황에서 통제 없이 성공 처리(fail-open), 내부 오류 노출, 예외 누락 등이 문제가 된다.","OWASP Top 10은 웹 위험을 분류한 인식 제고 자료로 실제 시험에서는 목록 외에 구체적 취약점 원인·대응도 묻는다. 2025년 판에는 A03 소프트웨어 공급망 실패, A10 부적절한 예외 처리가 추가·강조되고 A01 접근통제 실패, A02 보안설정 오류, A05 인젝션 등 분류가 구성되어 있다. 교재가 2021년 분류를 인용하는 경우 연도 차이를 표시한다."],"example":"2025 A01 Broken Access Control\nA02 Security Misconfiguration\nA03 Software Supply Chain Failures\nA04 Cryptographic Failures\nA05 Injection\nA06 Insecure Design\nA07 Authentication Failures\nA08 Software/Data Integrity Failures\nA09 Security Logging \u0026 Alerting Failures\nA10 Mishandling of Exceptional Conditions","question":"외부 패키지 공급망 공격과 예외 처리 오류가 보안에 미치는 영향 및 보완 방안을 설명하시오.","answer":"공급망 공격은 외부 라이브러리·업데이트·빌드 파이프라인 등 신뢰하는 구성요소를 통해 악성코드나 취약성이 유입되는 위험이다. 의존성 검증, 서명·무결성 확인, SBOM, 업데이트·빌드 권한 통제를 적용한다. 부적절한 예외 처리는 오류 상황에서 민감한 내부 정보가 유출되거나 안전한 기본 상태로 전환하지 못하는 문제다. 사용자에게 상세 스택 정보를 노출하지 않고 내부 로그에 안전하게 기록하며 예외 시 기본 거부·트랜잭션 롤백 등으로 처리한다.","keywords":"공급망 경로·무결성·SBOM, 예외 시 안전한 실패·로그","pitfall":"OWASP Top 10은 중요 위험 범주 안내이며, 개별 취약점의 고유 번호 목록인 CVE와 혼동하지 않는다.","sourceUrl":"https://top10.owasp.org/2025/","compact":"개인정보 보호법: 수집·이용(제15조), 제3자 제공(제17조), 파기(제21조), 안전성 확보조치(제29조). 최소 권한·인증·접속기록·암호화·백업·내부관리계획. 2026 시행 고시 기준 확인.","walk":[{"title":"분류의 목적 이해","body":"OWASP Top 10은 웹 응용프로그램의 대표적인 위험을 설명하는 인식 제고 자료이며, 특정 제품의 취약점 목록이나 시험 공식 출제표가 아니다."},{"title":"2025 항목 위치 확인","body":"A01은 Broken Access Control, A02는 Security Misconfiguration, A03은 Software Supply Chain Failures다. 이전 버전과 항목 이름과 번호를 섞어 쓰지 않는다."},{"title":"공급망 실패 예시","body":"검증되지 않았거나 취약한 라이브러리, 악의적 패키지, 빌드·배포 경로 침해 등 제3자 구성요소와 공급 절차의 보안 실패를 포함한다."},{"title":"예외 처리 문제 예시","body":"A10 Mishandling of Exceptional Conditions는 비정상 상태에서 민감한 오류 정보를 노출하거나, 예외 발생 시 권한 검사를 우회하는 fail-open 등을 포함한다."},{"title":"답안에서 연도 표시","body":"‘OWASP Top 10:2025’와 ‘2021’ 목록을 구별하고, 사용한 버전을 명시한다. 대응은 공급망 검증, 종속성 관리, 안전한 오류 처리, 기본거부 원칙 등을 제시한다."}],"compactNotes":[{"title":"취약점 식별과 테스트","content":"CVE=공개 취약점 식별번호, CWE=약점 유형 분류, CVSS=취약점 심각도 점수. Nessus=취약점 스캐너, 퍼징=예상 밖 데이터를 입력해 결함 탐지, Tripwire=파일 무결성 점검."}],"shortQuestion":{"question":"OWASP Top 10:2025의 A03과 A10 위험 범주 명칭은?","answer":"A03=소프트웨어 공급망 실패, A10=부적절한 예외 처리","keywords":["공급망","예외"]}},{"id":"modern-threat","n":23,"title":"MITRE ATT\u0026CK · 자격증명 탈취 탐지","priority":1,"area":"01 시스템 보안","summary":"ATT\u0026CK는 공격자 전술·기술을 체계화한 지식베이스이며, 공격 흐름에 맞춰 탐지 데이터를 연결한다.","sourceDetails":["① Initial Access, Execution, Persistence, Privilege Escalation, Credential Access, Lateral Movement, Exfiltration 등 전술을 이용해 공격 단계를 표현한다.","② LSASS 메모리 자격증명 덤프는 ATT\u0026CK T1003.001이며 비정상 프로세스의 LSASS 접근, 메모리 덤프 생성, 연속 인증 시도를 묶어 탐지할 수 있다.","③ Sysmon, Windows Security, EDR 로그는 서로 다른 관측 범위를 가지며 시각 동기화·계정·프로세스 GUID를 연계해야 탐지 정확도가 높아진다.","MITRE ATT\u0026CK는 실제 공격자의 행동을 전술(목적)과 기법(수행 방식)으로 구조화한 지식체계다. 초기 접근·실행·지속성·권한 상승·방어 회피·자격증명 접근·측면 이동·유출 등의 단계에서 관측 가능한 증거를 연결한다. 공격 징후는 단일 IOC만으로 확정하지 않고 정상 관리자 행위 여부와 함께 확인한다."],"example":"예: 피싱(초기 접근) → PowerShell(실행) → Run Key/Task(지속성)\n→ LSASS 자격증명 접근 → 원격 서비스(측면 이동) → 외부 전송(유출)\n탐지: 메일·프로세스·레지스트리·네트워크 증거 상관 분석","question":"피싱 메일 이후 PowerShell 실행, 예약 작업 등록, 자격증명 접근이 확인되었다. 대응 우선순위를 서술하시오.","answer":"피싱을 통한 초기 접근과 PowerShell 실행, 예약 작업을 통한 지속성, 자격증명 접근 시도로 이어진 공격 흐름을 의심한다. 감염 호스트 및 영향 계정의 접근을 제한하고, 실행 기록·스크립트·예약 작업·LSASS 접근 흔적·네트워크 로그를 보존한다. 지속성 수단과 악성 파일을 제거하고 자격증명 재설정·MFA 점검, 측면 이동·유출 여부 확인, 모니터링 강화와 재발방지 교육을 진행한다.","keywords":"전술/기법 구분, 증거, 범위조사, 차단·제거·계정복구","pitfall":"ATT\u0026CK 분류는 침해 확정 증거가 아니라 관측된 행위를 정리하는 틀이다.","sourceUrl":"https://attack.mitre.org/techniques/T1003/001/","compact":"정당성(적법한 절차), 무결성(변조 방지·해시), 재현성(동일 절차·결과), 신속성(휘발성 증거 대응), 절차 연속성(증거 관리 기록).","walk":[{"title":"전술과 기술 구별","body":"MITRE ATT\u0026CK은 공격자 행위를 전술(목적)과 기술(방법) 등으로 분류한 지식기반이다. MITRE가 공식적으로 공격을 검증해 준다거나 취약점 점수를 매긴다는 의미는 아니다."},{"title":"공격 흐름을 관측","body":"피싱/초기침투→실행→지속성→권한상승→자격증명 접근→측면 이동→수집/유출 같은 일련의 행위를 각 로그와 연결해 본다."},{"title":"자격증명 공격을 분리","body":"Credential Stuffing은 유출된 ID/PW 재사용, Password Spraying은 다수 계정에 공통 비밀번호 소수 반복, Pass-the-Hash는 해시 값 재사용을 말한다."},{"title":"방어 통제에 매핑","body":"MFA, 침해 계정 제한, 이상 로그인 탐지, EDR, 네트워크 세분화, 권한 최소화 등으로 각 공격 단계의 성공 가능성을 낮춘다."},{"title":"서술을 증거 중심으로","body":"공격 이름만 나열하지 말고 로그인 실패 분포, 비정상 프로세스, 계정 권한, 네트워크 연결 등 단계별 증거와 대응책을 엮는다."}],"compactNotes":[{"title":"인증 공격","content":"크리덴셜 스터핑=유출된 ID/PW 재사용 대입, Password Spraying=다수 계정에 소수의 흔한 PW 반복, Pass-the-Hash=NTLM 해시를 이용한 인증 우회(패스워드 원문 필요 없음)."}],"shortQuestion":{"question":"유출된 ID/PW를 다른 서비스에 재사용하는 공격과 NTLM 해시를 재사용하는 공격을 각각 쓰시오.","answer":"Credential Stuffing, Pass-the-Hash","keywords":["Credential Stuffing","Pass-the-Hash"]}},{"id":"http-sec","n":24,"title":"HTTP 응답보안 · TLS · 캐시·CORS","priority":1,"area":"03 애플리케이션 보안","summary":"Cache-Control:no-cache는 재검증, no-store는 저장하지 않음. CORS는 브라우저의 교차 출처 읽기 제어이다.","sourceDetails":["① Cache-Control: no-store는 민감 응답의 저장을 금지하도록 지시하고, no-cache는 재사용 전에 원본 서버 검증을 요구한다.","② HSTS는 브라우저에 지정 기간 HTTPS만 사용하도록 알린다. CSP는 허용된 스크립트 등 자원 출처를 제한해 XSS 피해 완화를 돕는다.","③ CORS의 Access-Control-Allow-Origin을 무분별하게 반사하거나 credentials를 허용하면 민감 데이터 노출 위험이 있다. CORS는 서버측 사용자 권한 검사를 대신하지 않는다.","④ Set-Cookie의 Secure/HttpOnly/SameSite 속성은 각각 전송 경로, 자바스크립트 접근, 사이트 간 요청의 쿠키 전송을 통제한다.","Secure는 HTTPS 요청에서만 쿠키를 보내도록 하고 HttpOnly는 자바스크립트에서 쿠키에 직접 접근하지 못하게 한다. SameSite는 교차 사이트 요청에서 쿠키 전달을 제한한다. Cache-Control: no-store는 응답 저장을 금지하고 no-cache는 재사용 전 재검증을 요구한다. CORS는 다른 Origin의 스크립트가 응답을 읽을 수 있는 범위를 제어하는 메커니즘으로 인증·인가 자체가 아니다."],"example":"Set-Cookie: session=xyz; Secure; HttpOnly; SameSite=Lax\nCache-Control: no-store  # 캐시 저장 금지\nCache-Control: no-cache  # 캐시는 재사용 전 재검증\nContent-Security-Policy: default-src 'self'  # 예시, 조정 필요","question":"Secure·HttpOnly·SameSite 쿠키 속성의 기능을 비교하고 no-cache와 no-store의 차이를 쓰시오.","answer":"Secure는 HTTPS 연결을 통한 전송으로 쿠키 노출을 줄이고, HttpOnly는 document.cookie 등 브라우저 자바스크립트의 쿠키 직접 접근을 제한하며, SameSite는 사이트 간 요청에서 쿠키 전송을 제한해 CSRF 위험을 완화한다. no-cache는 캐시가 응답을 저장할 수 있지만 서버 검증 없이 재사용하지 못하게 하고, no-store는 응답을 저장하지 못하게 한다. 이 속성들만으로 XSS·CSRF·세션 탈취를 완전히 차단할 수는 없다.","keywords":"Secure HTTPS, HttpOnly JS, SameSite 교차 사이트, no-cache 검증, no-store 저장금지","pitfall":"HSTS가 서버 인증서의 신뢰성을 대신 확인해 주지는 않는다.","sourceUrl":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control","compact":"크리덴셜 스터핑=유출된 ID/PW 재사용 대입, Password Spraying=다수 계정에 소수의 흔한 PW 반복, Pass-the-Hash=NTLM 해시를 이용한 인증 우회(패스워드 원문 필요 없음).","walk":[{"title":"헤더의 역할부터 구분","body":"Secure/HttpOnly/SameSite는 쿠키 속성, HSTS는 브라우저가 해당 사이트를 HTTPS로 접속하게 하는 정책, CSP는 브라우저의 콘텐츠 실행을 제한하는 정책이다."},{"title":"캐시 지시어 읽기","body":"Cache-Control: no-store는 응답 저장을 금지하고, no-cache는 저장된 응답을 재사용하기 전에 원 서버 재검증을 요구한다. 이름이 비슷해도 효과가 다르다."},{"title":"CORS 적용 범위","body":"CORS는 브라우저가 다른 출처로 보낸 요청의 응답을 자바스크립트가 읽도록 허용하는 정책과 관련된다. 서버 측 인가를 대신하지 않으며 임의 Origin 반사·자격증명 허용은 위험할 수 있다."},{"title":"XSS/CSRF와 연결","body":"출력 인코딩·CSP는 XSS 위험 감소에, 서버 검증 토큰과 SameSite는 CSRF 위험 감소에 기여한다. 쿠키의 HttpOnly만으로 스크립트 실행을 막는 것은 아니다."},{"title":"HTTP 설정 답안 구성","body":"문제에서 제시된 응답 헤더를 하나씩 읽고, 막는 공격과 막지 못하는 공격을 구분해 1문장씩 적는다. 캐시·쿠키·전송보안·출처 통제를 섞어 쓰지 않는다."}],"compactNotes":[],"shortQuestion":{"question":"Cache-Control의 no-cache와 no-store 차이는?","answer":"no-cache=재사용 전 원 서버 재검증, no-store=응답 저장 금지","keywords":["재검증","저장"]}},{"id":"nistpassword","n":25,"title":"2025 NIST 비밀번호 권고 · 기존 규정 비교","priority":1,"area":"05 정보보호관리 및 법률","summary":"NIST SP 800-63B-4는 단일요소 비밀번호 최소 15자, MFA 구성 비밀번호 최소 8자, 정기 변경 강제 금지를 규정한다.","sourceDetails":["① 단일요소 로그인 비밀번호 최소 15자, 다요소 인증에 함께 쓰는 비밀번호는 최소 8자를 허용하는 것이 지침이다.","② 대·소문자/특수문자 조합 등 특정 문자종류 구성을 강제하지 말아야 하며, 탈취된 비밀번호 차단목록, 무차별 대입 제한을 적용해야 한다.","③ 침해 증거가 없는 정기적 비밀번호 변경 강제는 권장하지 않는다. 침해 시에는 재설정을 요구해야 한다.","④ 기관별 규정이나 당시 시험 문제의 조항과 NIST 권고를 동일 법적 의무로 혼동해서는 안 된다.","과거 시험에서 자주 다루던 비밀번호 복잡도 규정(영문/숫자/특수문자 개수 조합, 주기적 강제 변경)과 현대적인 NIST 권고(길이·유출 비밀번호 차단·추측 방지)를 구분해야 한다. 현재 NIST SP 800-63B-4는 단일 요소 인증 비밀번호 최소 15자 원칙을 제시하며, 침해 증거가 없는 상황의 정기적 강제 변경이나 문자 종류 강제 혼합을 일반적으로 권장하지 않는다."],"example":"시험에서 법령의 시점이 주어지면 해당 당시 기준으로 답한다.\n현대적 운영: 충분한 길이, 흔하거나 유출된 문자열 차단, 시도 횟수 제한, MFA, 안전한 해시 저장.\n규제상 정해진 별도 복잡도 정책은 그 자체의 의무 여부를 확인.","question":"비밀번호 정책의 길이·복잡도·변경 주기를 설명할 때 오래된 기출과 최근 보안 권고를 구별해야 하는 이유는?","answer":"과거 고시나 시험 복원문제는 문자 종류별 조합과 정기적 변경주기를 중심으로 설명할 수 있으나 기준과 시행 시점이 바뀔 수 있다. 최근 NIST 비밀번호 권고는 길이, 유출·사전형 비밀번호 차단, 온라인 추측 공격 제한, MFA 같은 요소를 중시한다. 따라서 시험에서 특정 고시·연도가 주어지면 그 기준을 따르고, 현행 보안 정책을 묻는 경우 최신 공인 권고와 적용 법령을 분리해 설명해야 한다.","keywords":"기준 시점, 충분한 길이, 유출검사, rate limit, 불필요한 주기변경 지양","pitfall":"NIST 지침은 한국 법령 자체가 아니다. 법적 의무·계약·기관 정책을 별도로 확인한다.","sourceUrl":"https://pages.nist.gov/800-63-4/sp800-63b.html","compact":"CVE=공개 취약점 식별번호, CWE=약점 유형 분류, CVSS=취약점 심각도 점수. Nessus=취약점 스캐너, 퍼징=예상 밖 데이터를 입력해 결함 탐지, Tripwire=파일 무결성 점검.","walk":[{"title":"어떤 규범을 묻는지 먼저 판단","body":"과거 국내 고시·기관별 비밀번호 정책과 최신 NIST SP 800-63B-4 권고를 같은 조항처럼 답하지 않는다. 시험지에 기준 연도가 있으면 그 시점으로 설명한다."},{"title":"길이 기준 이해","body":"NIST SP 800-63B-4는 단일 요소로 쓰이는 비밀번호에 최소 15자, 다요소 인증에 함께 쓰이는 비밀번호에는 최소 8자를 요구한다."},{"title":"구성 규칙 변화","body":"대문자·숫자·특수문자 몇 개 이상 같은 문자 종류 강제는 사용자가 예측 가능한 패턴을 만들 수 있다는 이유 등으로 요구하지 않도록 한다."},{"title":"변경주기·차단목록","body":"침해 정황이 없는데도 무조건 주기적 변경을 강제하지 않으며, 흔하거나 유출된 비밀번호 차단과 온라인 시도 제한을 시행한다. 침해 시에는 재설정을 요구한다."},{"title":"시험 답안에서 한계 명시","body":"NIST는 기술 지침이지 대한민국 모든 조직에 자동 적용되는 법률이 아니다. 특정 법령·기관 정책을 묻는 문제라면 해당 규정과 현행 권고를 구분한다."}],"compactNotes":[],"shortQuestion":{"question":"NIST SP 800-63B-4의 단일 요소 비밀번호 최소 길이와 정기 변경 강제 원칙을 쓰시오.","answer":"단일 요소 최소 15자, 침해 징후 없는 정기적 변경을 강제하지 않음","keywords":["15","변경"]}}];
const CASES=[{"title":"사례 1. 웹쉘 의심 로그 분석","question":"10:01 POST /upload.jsp 200, 10:02 GET /uploads/report.jsp 200, 10:03 POST /uploads/report.jsp?cmd=whoami 200이 확인되었다. ① 공격 유형 ② 판단 근거 ③ 초기 조치 ④ 재발 방지 2가지를 쓰시오.","answer":"① 서버 측 스크립트 파일 업로드 후 실행한 웹쉘 공격 의심이다. ② 업로드 뒤 /uploads 하위 .jsp 호출이 이어지고 cmd 인자로 명령 실행을 시도한 흔적이 있다. ③ 웹서버 로그·업로드 파일·프로세스·네트워크 연결 등 증거를 확보하고, 영향 범위를 점검하면서 해당 경로 접근 및 실행을 차단한다. ④ 허용 확장자·파일 서명·MIME 검증과 웹 루트 외부 저장, 업로드 디렉터리의 스크립트 실행 금지, 파일명 무작위화 및 접근권한 최소화를 적용한다.","id":"case-1","walk":[{"title":"로그를 시간순으로 읽는다","body":"10:01 POST /upload.jsp는 업로드 요청으로 보인다. 이후 10:02 GET /uploads/report.jsp와 10:03 POST /uploads/report.jsp?cmd=whoami가 이어진다. 업로드된 경로에 서버 실행 확장자(.jsp)가 나타난다는 점이 가장 중요한 단서다."},{"title":"가능한 공격을 가설로 세운다","body":"사용자가 올린 JSP 파일이 웹서버에서 실행되었다면 웹쉘을 통한 명령 실행일 수 있다. cmd=whoami 형태의 파라미터는 OS 명령 실행 시도로 의심되지만 로그 한 줄만으로 실제 실행 성공을 확정할 수는 없다."},{"title":"증거 확보 순서를 정한다","body":"웹 접근·오류 로그, 업로드된 파일 원본과 해시, WAS 프로세스·자식 프로세스, 비정상 외부 연결과 명령 실행 흔적을 시각 기준으로 확보한다."},{"title":"초기 대응과 재발 방지를 나눈다","body":"악성 파일 격리, 관련 계정·세션 검토, 서버 통신 차단 등 봉쇄를 검토한다. 장기적으로 확장자/내용 검증, 웹 루트 밖 저장, 업로드 경로 실행 차단, 최소권한을 적용한다."},{"title":"채점 답안을 완성한다","body":"① 웹쉘 의심 ② JSP 업로드 뒤 해당 경로 실행과 cmd 파라미터 ③ 관련 로그·파일·프로세스 증거 확보 및 봉쇄 ④ 업로드 검증·실행 금지 등을 항목별로 작성한다."}],"keywords":["웹쉘","jsp","증거","실행 차단"],"priority":3},{"title":"사례 2. Snort 패킷 탐지 룰","question":"alert tcp any any -\u003e $HOME_NET 80 (msg:\"GET detected\"; content:\"GET\"; depth:3; sid:1000010; rev:2;)를 해석하고, 이 룰 하나로 공격 확정이 불가한 이유를 쓰시오.","answer":"내부 $HOME_NET의 TCP 목적지 포트 80으로 향하는 패킷의 앞쪽 검색 영역 3바이트에서 GET을 찾아 일치 시 경고한다. msg는 기록할 경고 메시지, sid는 고유한 룰 식별번호, rev는 수정 버전이다. 정상적인 HTTP GET 요청도 동일 패턴을 갖기 때문에 이 룰은 단독으로 악성 여부를 판단할 수 없으며 출발지·요청 빈도·URI·응답 코드 등 맥락을 추가 조사해야 한다.","id":"case-2","walk":[{"title":"룰 헤더를 분해한다","body":"alert tcp any any -\u003e $HOME_NET 80은 모든 출발지 주소·포트에서 내부망의 TCP 80포트로 향하는 패킷에 대해 규칙을 검사하고, 일치하면 경보한다는 뜻이다."},{"title":"옵션을 하나씩 뜻풀이","body":"msg는 출력 메시지, content:\"GET\"은 문자열 탐지, depth:3은 검색 영역의 처음 3바이트 검사 범위, sid는 룰 ID, rev는 개정 번호다."},{"title":"실제 일치 사례를 상상한다","body":"HTTP GET 요청의 맨 앞 세 글자가 GET이면 이 간단한 패턴과 일치한다. 정상 사용자가 웹페이지를 여는 트래픽에서도 일치할 수 있다."},{"title":"오탐 원인을 설명한다","body":"GET 문자열은 공격의 고유 증거가 아니며 TCP 페이로드에 이 문자열이 있다고 공격이 성공했다고 볼 수 없다. HTTP 요청 구조, URI, 빈도 등 추가 문맥이 필요하다."},{"title":"모범답안 구조","body":"① 대상과 방향 ② content·depth·sid 등 옵션 ③ 정상 트래픽에도 탐지되는 이유 ④ 정교한 조건 추가·로그 연관분석 순으로 적는다."}],"keywords":["alert","TCP","content","depth","오탐"],"priority":3},{"title":"사례 3. 개인정보 대량 조회 조사","question":"업무 외 시간에 한 계정이 개인정보 20만 건을 다운로드했다. 취약한 관리 항목과 조사·대응 과정을 작성하시오.","answer":"접근권한의 적정성, 대량 조회·다운로드 사유 확인, 접근통제와 접속기록 점검 체계가 문제 될 수 있다. 계정, 접속일시, 접속지, 처리한 정보주체, 수행 업무 등 기록을 확보하고 인사·업무 변경과 다운로드 승인 여부, 유출 정황을 조사한다. 필요 시 계정 권한을 최소화·차단하고 로그 위변조를 방지하며 적용 법령에 따른 사고 통지·신고 의무를 별도 검토한다. 대량 다운로드 자체만으로 법 위반이나 외부 유출을 자동 확정하지 않는다.","id":"case-3","walk":[{"title":"이상 행위를 정확히 정의","body":"업무 시간 외 20만 건 다운로드는 대량·시간대 이상징후일 뿐, 유출로 확정된 사실은 아니다. 승인된 업무였는지와 접근권한이 적절했는지를 조사해야 한다."},{"title":"필요한 기록을 나열","body":"계정, 접속 시각, 접속지 IP, 처리한 정보주체의 범위, 수행 업무, 다운로드 파일 및 승인 여부, 대상 시스템 로그를 확보한다."},{"title":"관련 관리 통제 판단","body":"대량 조회 권한, 업무상 필요성, 접근통제, 접속기록 점검, 다운로드 사유 확인 절차가 적절했는지 평가한다."},{"title":"법령의 현행 기준 확인","body":"2026년 7월 시행 고시는 접속기록 보관기간의 1년/특정 조건 2년 기준과 내부관리계획에 정한 점검 절차를 요구한다. 문제에서 구법 시점을 특정하면 구법 적용 여부를 따로 본다."},{"title":"대응 단계까지 쓰기","body":"증거를 안전하게 보존하고 계정 권한 제한 및 보고 절차를 검토하며, 유출 여부·영향 범위가 확인되면 법정 통지·신고 의무 해당 여부 등을 판단한다."}],"keywords":["접속기록","다운로드","권한","조사"],"priority":3},{"title":"사례 4. 리눅스 보안 설정 점검","question":"사용자 홈 디렉터리에서 -rwsrwxrwx root root 프로그램을 발견했다. 문제점과 안전한 조치 방법을 제시하시오.","answer":"해당 파일은 SetUID가 설정되어 실행 시 파일 소유자인 root의 유효 권한으로 수행될 수 있고, 그룹·기타 사용자에게 쓰기 권한까지 허용돼 권한 상승 위험이 매우 크다. 해당 파일의 필요성·출처·변경 이력을 확인하고 무분별한 실행을 제한한다. 불필요한 SUID를 chmod u-s로 제거하고 그룹/기타 사용자 쓰기 권한을 chmod go-w로 제거하며 적절한 소유자·실행권한을 재설정한다. 변경 전후 권한과 동작을 확인한다.","id":"case-4","walk":[{"title":"권한 문자열 해석","body":"-rwsrwxrwx의 처음 -는 일반 파일이며, 소유자 실행 위치 s는 SetUID가 설정된 상태다. 그룹·기타 사용자 rwx로 누구나 쓰고 실행할 수 있다."},{"title":"위험의 핵심 파악","body":"소유자가 root인 SUID 파일이므로 실행 중 root 유효 권한을 얻을 수 있다. 누구나 파일 자체를 수정할 수 있다면 악성 코드를 넣어 권한 상승을 시도할 가능성이 크다."},{"title":"진단 명령 작성","body":"find / -type f -perm -4000 2\u003e/dev/null은 SetUID 일반 파일 목록을 찾는다. ls -l로 소유자와 기타 쓰기권한도 함께 확인하고 변경시각·해시를 조사한다."},{"title":"안전한 변경 절차","body":"필요성과 파일 출처를 검토한 뒤 격리·백업하고, 불필요한 SUID는 chmod u-s로 제거한다. 그룹·기타 사용자 쓰기권한도 서비스 요구사항에 맞춰 줄인다."},{"title":"재검증과 보고","body":"권한 변경 후 ls -l과 실제 동작을 확인하고 이상 실행 흔적·변경 이력, 재발 방지 권한 정책을 기록한다."}],"keywords":["SetUID","쓰기","find","chmod"],"priority":3},{"title":"사례 5. 위험평가·BCP 연계","question":"중요 서비스의 연간 예상 손실액이 2,000만 원이다. 방어 비용이 연 300만 원이고 사고 발생 가능성을 낮춰 ALE를 800만 원으로 줄일 수 있다. 비용 편익과 RTO/RPO 차이를 설명하시오.","answer":"도입 전 ALE 2,000만 원에서 도입 후 ALE 800만 원으로 연간 예상 손실 감소액은 1,200만 원이다. 연간 통제 비용 300만 원을 고려하면 순 기대 절감액은 900만 원으로 경제적으로 고려할 가치가 있다(다른 비용과 위험 가정은 별도 검토). RTO는 서비스가 복구되어야 하는 목표 최대 시간, RPO는 사고 시 허용 가능한 데이터 손실 범위를 시간으로 나타내는 복구 시점 목표다. 예를 들어 RTO 4시간은 4시간 이내 서비스 복구, RPO 1시간은 최대 1시간 전 상태까지의 데이터 손실 허용을 뜻한다.","id":"case-5","walk":[{"title":"문제의 숫자를 분리","body":"방어 전 ALE=2,000만 원, 방어 후 ALE=800만 원, 연간 보안대책 비용=300만 원이다. 한 번의 손실(SLE)과 연간 예상 손실(ALE)을 혼동하지 않는다."},{"title":"기대 손실 감소 계산","body":"2,000만−800만=연간 1,200만 원의 예상 손실 감소다. 사고 발생률과 손실영향이 함께 달라질 수 있으므로 여기서는 주어진 ALE를 그대로 사용한다."},{"title":"비용을 반영","body":"감소액 1,200만 원에서 연간 비용 300만 원을 빼면 순 기대 편익은 연 900만 원이다. 실제 투자판단에는 기타 비용·불확실성을 별도로 고려한다."},{"title":"RTO와 RPO 구분","body":"RTO는 복구 목표 시간(서비스 중단 허용 범위), RPO는 복구할 수 있는 데이터 시점으로 표현되는 최대 허용 데이터 손실 범위다. 예를 들어 RPO 2시간은 최대 2시간치 데이터 손실 허용을 뜻한다."},{"title":"답안 완성","body":"연 1,200만 원 손실 감소, 연 900만 원 순 기대 절감, RTO=서비스 복구 목표 시간, RPO=데이터 손실 허용 시점 차이로 구분해 서술한다."}],"keywords":["1200","900","RTO","RPO"],"priority":3}];
const KEY='infosec-final-detail-2026-v1';
const NAVS={home:'학습 대시보드',learn:'25개 상세 이론',memory:'최종 암기 25개',quiz:'유형별 문제풀이',mock:'실전 모의고사',review:'오답·복습'};
function e(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function line(s){return e(s).replace(/\n/g,'<br>')}
function textOrDash(s){return s?line(s):'해당 항목 없음'}
function priority(n){return n===3?'★★★ 최우선':n===2?'★★ 중요':'★ 보충'}
function pclass(n){return 'p'+n}
function getSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
const saved=Object.assign({learn:{},mem:{},answered:{},favorites:{},draft:{},mockHistory:[],mock:null},getSaved());
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(err){console.warn('학습 상태 저장 불가',err)}}
function notify(msg){let el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function pct(a,b){return b?Math.round(a/b*100):0}
function labelType(t){return t==='short'?'단답형':t==='essay'?'서술형':'실무형'}
const Q=[];
for(const d of DATA){Q.push({id:'s-'+d.id,lesson:d.id,priority:d.priority,type:'short',title:d.title,question:d.shortQuestion.question,answer:d.shortQuestion.answer,keywords:d.shortQuestion.keywords,walk:d.walk,reference:d.summary,sourceAnswer:d.answer,max:3});Q.push({id:'e-'+d.id,lesson:d.id,priority:d.priority,type:'essay',title:d.title,question:d.question,answer:d.answer,keywords:d.keywords.split(/[,，\/]/).map(x=>x.trim()).filter(Boolean),walk:d.walk,reference:d.summary,sourceAnswer:d.answer,max:12});}
for(const c of CASES){Q.push({id:c.id,lesson:null,priority:3,type:'case',title:c.title,question:c.question,answer:c.answer,keywords:c.keywords,walk:c.walk,reference:'종합 실무형 사례',sourceAnswer:c.answer,max:16});}
const byId=id=>DATA.find(x=>x.id===id);
const byQ=id=>Q.find(x=>x.id===id);
const topicOf=q=>q.lesson?byId(q.lesson):null;
const $=s=>document.querySelector(s);
const UI={view:'home',topic:'risk-bcp',query:'',topicPr:'all',memoryPr:'all',revealedMem:{},quizType:'all',quizPr:'all',quizQuery:'',quizId:'s-risk-bcp',quizReveal:false,quizStep:0,reviewMode:'wrong',mockTime:120};
function bar(){document.querySelector('#barTitle').textContent=NAVS[UI.view]||'상세 학습';document.querySelector('#tinyProgress').textContent=Object.keys(saved.learn).filter(k=>saved.learn[k]).length+'/25 학습';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.nav===UI.view))}
function goto(view){UI.view=view;window.scrollTo(0,0);$('#side').classList.remove('open');render()}
function render(){bar();const r={home:home,learn:learn,memory:memory,quiz:quiz,mock:mock,review:review}[UI.view]||home;$('#app').innerHTML=r();}
function badge(n){return `<span class="pill ${pclass(n)}">${priority(n)}</span>`}
function hd(title,sub=''){return `<h1 class="title">${e(title)}</h1>${sub?`<p class="sub">${e(sub)}</p>`:''}`}
function learned(){return Object.values(saved.learn).filter(Boolean).length}
function known(){return Object.values(saved.mem).filter(x=>x==='know').length}
function wrong(){return Q.filter(x=>saved.answered[x.id]==='wrong').length}
function progress(){return `<div class="progress"><div style="width:${pct(learned(),25)}%"></div></div>`}
function home(){return `<div class="hero"><div><div class="mini">시험 전날을 위한 이해 중심 학습</div><h1>외우기 전에 이해하고,<br>답을 보기 전에 직접 써보세요.</h1><p>25개 상세 이론을 읽고 → 단답형·서술형·실무형 55문제를 풀고 → 17문항 실전 모의고사로 마무리하세요. 모든 문제에 단계별 해설이 있습니다.</p><div class="controlRow mt"><button class="btn primary" data-action="open-priority">★★★ 최우선 1번부터 학습</button><button class="btn" data-action="open-quiz">문제부터 풀기</button></div></div><div class="status"><b>${learned()}/25</b><small>학습 완료한 주제</small></div></div>
<h2 class="section">나의 학습 현황</h2><div class="grid stats"><div class="card stat"><b>${learned()}<small>/25</small></b><span>상세 이론 학습</span>${progress()}</div><div class="card stat"><b>${known()}<small>/25</small></b><span>암기 완료 표시</span></div><div class="card stat"><b>${wrong()}<small>문항</small></b><span>오답 복습 필요</span></div></div>
<h2 class="section">시험 전날 추천 순서</h2><div class="grid"><div class="card"><span class="pill p3">첫 번째</span><h3>최우선 10개 집중</h3><p class="muted small">위험관리 → XSS/CSRF → 권한 → Snort/방화벽 → SQLi → SSRF/XXE → 개인정보 → DDoS → 이메일 → 사고대응</p><button class="btn soft" data-nav="learn">상세 이론 읽기</button></div><div class="card"><span class="pill p2">두 번째</span><h3>서술·실무 직접 작성</h3><p class="muted small">모범답안을 먼저 보지 말고, 원인·근거·대응을 작성한 뒤 단계별 해설을 하나씩 열어 확인하세요.</p><button class="btn soft" data-action="essay-first">서술형 문제 풀기</button></div><div class="card"><span class="pill p1">마지막</span><h3>17문항 실전 점검</h3><p class="muted small">단답 12×3점, 서술 4×12점, 실무형 2개 중 1개 선택 16점. 실기 답안처럼 직접 작성해 자가채점합니다.</p><button class="btn soft" data-nav="mock">모의고사 시작</button></div></div>
<h2 class="section">오늘 먼저 볼 10개</h2><div class="overviewList">${DATA.filter(x=>x.priority===3).map(x=>`<button class="topicLink" data-topic="${e(x.id)}"><div><small>${String(x.n).padStart(2,'0')} · ${e(x.area)}</small><b>${e(x.title)}</b></div>${saved.learn[x.id]?'✅':badge(x.priority)}</button>`).join('')}</div><div class="footnote">자료 구성: 기존 최종 압축 암기 DOCX + 최종 상세 학습서 DOCX의 25개 주제와 실무 사례 5개. 단계별 추가 해설은 학습용으로 새로 작성했습니다. 법령·기술 기준은 출제 시점과 버전을 확인하세요.</div>`}
function topicsFiltered(){return DATA.filter(x=>(UI.topicPr==='all'||x.priority===Number(UI.topicPr))&&(x.title+' '+x.summary+' '+x.area).toLowerCase().includes(UI.query.toLowerCase()))}
function studySteps(d){return `<div class="steps">${d.walk.map((st,i)=>`<div class="step"><span class="n">${i+1}</span><div><strong>${e(st.title)}</strong><p>${e(st.body)}</p></div></div>`).join('')}</div>`}
function learn(){const d=byId(UI.topic)||DATA[0];const items=topicsFiltered();return `${hd('25개 상세 이론','이해할 때까지 천천히 읽고, 예시와 예상문제로 다시 확인하세요. (최우선 10개 → 중요 7개 → 보충 8개)')}
<div class="topicLayout"><aside class="card topicList"><div class="boxTitle">이론 선택</div><input class="search" style="width:100%" id="topicSearch" placeholder="개념·공격·명령어 검색" value="${e(UI.query)}" aria-label="이론 검색"><div class="chips mt"><button class="chip ${UI.topicPr==='all'?'active':''}" data-pr="all">전체</button><button class="chip ${UI.topicPr==='3'?'active':''}" data-pr="3">★★★</button><button class="chip ${UI.topicPr==='2'?'active':''}" data-pr="2">★★</button><button class="chip ${UI.topicPr==='1'?'active':''}" data-pr="1">★</button></div><div id="topicOptions">${items.map(t=>`<button class="topicLink ${d.id===t.id?'on':''}" data-topic="${e(t.id)}"><div><small>${String(t.n).padStart(2,'0')} · ${priority(t.priority)}</small><b>${e(t.title)}</b></div>${saved.learn[t.id]?'✓':''}</button>`).join('')||'<p class="muted small">검색 결과 없음</p>'}</div></aside><article class="topicBody"><div class="panel"><div class="split">${badge(d.priority)}<span class="muted small">${e(d.area)} · ${d.n}/25</span></div><h2 style="font-size:24px;line-height:1.4;margin:14px 0">${e(d.title)}</h2><div class="lead">${line(d.summary)}</div><div class="controlRow mt"><button class="btn ${saved.learn[d.id]?'green':'primary'}" data-action="learned" data-id="${e(d.id)}">${saved.learn[d.id]?'✓ 학습 완료 (취소 가능)':'□ 학습 완료 표시'}</button><button class="btn soft" data-action="quiz-for" data-id="${e(d.id)}">이 주제 문제 풀기</button><button class="btn" data-action="next-topic">다음 주제 →</button></div></div>
<div class="panel mt"><h3 class="boxTitle">① 단계별로 개념 이해하기</h3><p class="tip">아래 순서는 자료 내용을 이해하기 쉽게 재구성한 추가 학습 해설입니다. 암기용 정답뿐 아니라 ‘왜’ 그런 답인지 살펴보세요.</p>${studySteps(d)}</div>
<div class="panel mt"><h3 class="boxTitle">② 상세 학습서 원문 해설</h3><p class="tip">앞서 작성한 26쪽 상세 학습서에서 가져온 설명입니다.</p><ol class="detailsList">${d.sourceDetails.map(t=>`<li>${line(t.replace(/^\s*[①②③④⑤⑥⑦]\s*/,''))}</li>`).join('')}</ol></div>
${d.compactNotes.length?`<div class="panel mt"><h3 class="boxTitle">③ 최종 압축 암기 원문과 연결하기</h3>${d.compactNotes.map(t=>`<div class="notePanel mb"><b>${e(t.title)}</b><div class="textBlock small mt">${line(t.content)}</div></div>`).join('')}</div>`:''}
<div class="panel mt"><h3 class="boxTitle">④ 명령어 · 로그 · 설정 · 계산 예시</h3><pre class="demo">${e(d.example)}</pre><p class="tip">예시는 학습용입니다. 운영 환경에서는 제품 버전·설정 경로·권한·영향도를 확인하세요.</p></div>
<div class="panel mt"><h3 class="boxTitle">⑤ 예상문제와 정답으로 연결</h3><div class="qBox"><div class="tag">상세 학습서의 실기 예상문제</div><div class="qText mt">${line(d.question)}</div></div><div class="controlRow mt"><button class="btn primary" data-action="quiz-for" data-id="${e(d.id)}">직접 풀고 단계별 해설 보기 →</button></div>${d.pitfall?`<div class="caution mt"><b>혼동 주의</b><div class="textBlock">${line(d.pitfall)}</div></div>`:''}${d.sourceUrl?`<p class="footnote">추가 확인용 공식/기술 참고: <a href="${e(d.sourceUrl)}" target="_blank" rel="noopener noreferrer">출처 열기 ↗</a> (외부 인터넷 필요)</p>`:''}</div></article></div>`}
function memory(){return `${hd('최종 암기 25개','앞서 만든 최종 압축 암기 자료를 원문대로 정리했습니다. 답을 가리고 스스로 설명한 뒤 필요하면 상세 이론으로 들어가세요.')}
<div class="controlRow mb"><button class="chip ${UI.memoryPr==='all'?'active':''}" data-mpr="all">전체 25개</button><button class="chip ${UI.memoryPr==='first'?'active':''}" data-mpr="first">최우선 12개</button><button class="chip ${UI.memoryPr==='second'?'active':''}" data-mpr="second">추가 13개</button><span class="muted small">기억함 ${known()}/25</span></div>
${Object.keys(COMPACT).filter(i=>UI.memoryPr==='all'||(UI.memoryPr==='first'?+i<=12:+i>=13)).map(i=>{let c=COMPACT[i];let id=COMPACT_TO_ID[i];let d=byId(id);return `<div class="recallCard"><div class="split"><div><span class="tag">${String(i).padStart(2,'0')} · ${+i<=12?'먼저 외울 12개':'추가 암기 13개'}</span><h3 style="margin:9px 0 8px">${e(c.title)}</h3></div><span class="pill ${saved.mem[i]==='know'?'p2':'p1'}">${saved.mem[i]==='know'?'✓ 기억함':'미확인'}</span></div>${UI.revealedMem[i]?`<div class="answerShown">${line(c.content)}</div>`:`<div class="answerHidden">정답을 가렸습니다. 먼저 소리 내어 설명해 보세요.</div>`}<div class="controlRow mt"><button class="btn ${UI.revealedMem[i]?'':'primary'}" data-action="mem-toggle" data-i="${i}">${UI.revealedMem[i]?'정답 가리기':'정답 보기'}</button><button class="btn ${saved.mem[i]==='know'?'green':''}" data-action="mem-mark" data-i="${i}" data-v="know">알고 있음</button><button class="btn warn" data-action="mem-mark" data-i="${i}" data-v="retry">다시 암기</button><button class="btn" data-topic="${e(id)}">상세 설명 →</button></div></div>`}).join('')}`}
