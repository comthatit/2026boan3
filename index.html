const COMPACT={"1":{"title":"위험관리","content":"자산(보호 대상)·위협(손실을 유발할 잠재 원인)·취약점(악용 가능한 약점). 위험식별→분석→평가→대책 선정·구현. 위험처리: 감소·회피·전가·수용. SLE=자산가치×노출계수, ALE=SLE×연간발생률."},"2":{"title":"XSS 3유형","content":"저장형=게시판·DB에 악성 스크립트 저장, 반사형=입력값이 응답에 반영, DOM 기반=브라우저 JS가 DOM을 위험하게 조작. 대응: 출력 문맥별 인코딩, 안전한 DOM API, 검증된 HTML 정화, CSP(보조책)."},"3":{"title":"리눅스 특수 권한","content":"SUID(4000)=파일 소유자 권한으로 실행, SGID(2000)=파일 그룹 권한으로 실행, Sticky(1000)=공유 디렉터리에서 임의 삭제 제한. 탐색: find / -type f -perm -4000 2\u003e/dev/null; -2000은 SGID; /6000은 둘 중 하나."},"4":{"title":"SQL Injection","content":"외부 입력을 SQL 구문에 직접 연결해 질의 구조가 바뀜. 원인: 문자열 연결. 대응: Prepared Statement·바인딩, 계정 최소 권한, 오류 정보 최소화. 단순 이스케이프·필터링만으로 대체 불가."},"5":{"title":"CSRF·SSRF·XXE","content":"CSRF=로그인된 브라우저에서 원치 않는 요청 강제(토큰·SameSite·Origin 검증). SSRF=서버가 공격자가 지정한 URL에 요청(허용목록·내부망 접근 차단). XXE=XML 외부 엔티티 악용(DTD·외부 엔티티 비활성화)."},"6":{"title":"웹쉘·파일 업로드","content":"의심 로그: POST 업로드 직후 .php/.jsp/.aspx 파일로 반복 접속. 대응: 확장자 허용목록+콘텐츠 확인, 랜덤 파일명, 웹 루트 밖 저장, 업로드 경로 스크립트 실행 금지, 접근제어."},"7":{"title":"방화벽·ACL","content":"iptables 기본 체인 INPUT(들어옴), OUTPUT(나감), FORWARD(경유). 예: iptables -A INPUT -p tcp --dport 23 -j DROP. DROP=응답 없이 폐기, REJECT=거부 응답. ACL은 위에서 아래로 순차 일치, 미일치 시 암묵적 거부에 유의."},"8":{"title":"Snort 룰·오탐","content":"alert tcp any any -\u003e $HOME_NET 80 (msg:\"WEB\"; content:\"GET\"; sid:1000001; rev:1;). msg=경고 문구, content=패턴, depth=검사 시작점부터 길이 제한. 오탐(FP)=정상→공격 판단; 미탐(FN)=공격→정상 판단."},"9":{"title":"DoS·DDoS","content":"SYN Flood=Half-open 연결 고갈. Smurf=피해자 IP 위조 후 ICMP 브로드캐스트 응답 집중. Land=출발지·목적지 IP 같게 위조. Teardrop=비정상 단편화·오프셋. 증폭공격=작은 요청으로 큰 응답 유발."},"10":{"title":"메일 인증 3종","content":"SPF=DNS TXT를 보고 발신 서버 IP 허용 여부 검증. DKIM=송신 서버 개인키 서명, DNS 공개키 검증. DMARC=보이는 From 도메인과 SPF/DKIM 결과의 정렬, 실패 처리 정책(none/quarantine/reject)."},"11":{"title":"침해사고 대응·증거","content":"준비→탐지·분석→봉쇄→제거→복구→사후 검토. 조치 전 휘발성 데이터 우선 수집 여부 판단, 증거 원본 보존·이미징·해시 비교·인수인계 기록(Chain of Custody)."},"12":{"title":"IPsec·TLS","content":"IPsec AH=무결성·출처 인증·재전송 방지, 기밀성 없음. ESP=기밀성 및 무결성·인증(사용 구성에 따름). 전송 모드=상위 계층 페이로드 보호, 터널 모드=원래 IP 패킷 캡슐화. TLS 1.3=(EC)DHE/PSK 기반 키 교환·AEAD 사용."},"13":{"title":"리눅스 패스워드","content":"/etc/passwd의 x→/etc/shadow에 해시 저장. $1=MD5, $5=SHA-256, $6=SHA-512(crypt 계열 식별자). PAM=인증·계정·비밀번호·세션 관리."},"14":{"title":"리눅스 로그·도구","content":"last=wtmp 로그인 이력, lastb=btmp 실패 이력, lastlog=최근 로그인, lsof=열린 파일, ss -tulpen=리스닝 포트, /proc/PID/cmdline=프로세스 실행 인자."},"15":{"title":"DNS 설정·공격","content":"named.conf=BIND DNS 서버 설정·zone 지정, resolv.conf=클라이언트 DNS 검색 설정. 캐시 포이즈닝=위조된 DNS 응답으로 잘못된 IP를 캐시에 저장. Zone Transfer·재귀 질의 대상을 제한."},"16":{"title":"보안관제 솔루션","content":"SIEM=로그 수집·상관 분석·경보, SOAR=탐지·분석 후 플레이북 자동화, EDR=엔드포인트 행위 탐지·대응, DLP=민감정보 유출 차단, WAF=HTTP 계층 웹공격 필터링."},"17":{"title":"Windows 보안","content":"UAC=관리자 권한 실행 통제. net share=공유 목록, net session=접속 세션. 4624=로그온 성공, 4625=실패, 4688=프로세스 생성(감사 설정 필요), 1102=보안 로그 삭제 이벤트."},"18":{"title":"접근통제 모델","content":"DAC=객체 소유자가 권한 관리, MAC=보안 등급·정책 기반 강제 접근제어, RBAC=역할별 권한 부여. 최소 권한·직무분리·기본거부를 답안에 함께 기재."},"19":{"title":"암호·서명","content":"대칭키=암·복호에 같은 키. 공개키 암호=키 쌍 사용. 전자서명=개인키로 서명, 공개키로 검증(무결성·서명자 인증 등). 해시=고정 길이 다이제스트, 암호화와 구별."},"20":{"title":"BCP·DRP·RTO·RPO","content":"BCP=핵심 업무 지속 계획, DRP=재해 발생 후 IT 복구 계획. RTO=허용 가능한 복구 목표 시간, RPO=허용 가능한 데이터 손실 시점 간격. 복구 우선순위·백업·훈련 연계."},"21":{"title":"정보보호 관리·ISMS-P","content":"정책 수립→위험 평가→보호대책 구현→점검·개선(PDCA). ISMS-P=정보보호 및 개인정보보호 관리체계 인증. 인증과 법적 안전조치 의무는 구분."},"22":{"title":"개인정보 안전성 확보","content":"개인정보 보호법: 수집·이용(제15조), 제3자 제공(제17조), 파기(제21조), 안전성 확보조치(제29조). 최소 권한·인증·접속기록·암호화·백업·내부관리계획. 2026 시행 고시 기준 확인."},"23":{"title":"디지털 포렌식","content":"정당성(적법한 절차), 무결성(변조 방지·해시), 재현성(동일 절차·결과), 신속성(휘발성 증거 대응), 절차 연속성(증거 관리 기록)."},"24":{"title":"인증 공격","content":"크리덴셜 스터핑=유출된 ID/PW 재사용 대입, Password Spraying=다수 계정에 소수의 흔한 PW 반복, Pass-the-Hash=NTLM 해시를 이용한 인증 우회(패스워드 원문 필요 없음)."},"25":{"title":"취약점 식별과 테스트","content":"CVE=공개 취약점 식별번호, CWE=약점 유형 분류, CVSS=취약점 심각도 점수. Nessus=취약점 스캐너, 퍼징=예상 밖 데이터를 입력해 결함 탐지, Tripwire=파일 무결성 점검."}};
const COMPACT_TO_ID={"1":"risk-bcp","2":"xss-csrf","3":"linux-perm","4":"sql-injection","5":"ssrf-xxe","6":"ssrf-xxe","7":"detection","8":"detection","9":"ddos","10":"mail-auth","11":"forensics","12":"ipsec","13":"linux-auth","14":"linux-logs","15":"arp-dns","16":"detection","17":"windows-evidence","18":"access-model","19":"tls-crypto","20":"risk-bcp","21":"isms","22":"privacy","23":"forensics","24":"modern-threat","25":"owasp25"};
function filteredQs(){return Q.filter(q=>(UI.quizType==='all'||q.type===UI.quizType)&&(UI.quizPr==='all'||q.priority===Number(UI.quizPr))&&(q.title+' '+q.question+' '+q.answer).toLowerCase().includes(UI.quizQuery.toLowerCase()))}
function choiceSelect(){const l=filteredQs();if(!l.length)return null;if(!l.some(x=>x.id===UI.quizId))UI.quizId=l[0].id;return byQ(UI.quizId)}
function helpSteps(q,count){return `<div class="steps">${q.walk.slice(0,count).map((st,i)=>`<div class="step"><div class="n">${i+1}</div><div><strong>${e(st.title)}</strong><p>${e(st.body)}</p></div></div>`).join('')}</div>`}
function explanation(q,showall=true){const d=topicOf(q);return `<div class="model"><h3>모범답안</h3><p>${line(q.answer)}</p></div>
${q.keywords.length?`<div class="mt"><b class="small">학습용 채점 키워드</b><div>${q.keywords.map(x=>`<span class="keyword">${e(x)}</span>`).join('')}</div></div>`:''}
<div class="mt"><h3 class="boxTitle">왜 이 답이 나오는가? — 단계별 상세 해설</h3>${helpSteps(q,showall?5:UI.quizStep)}</div>
${d&&q.type!=='short'?`<div class="mt"><h3 class="boxTitle">상세 학습서의 원리 설명 (추가 복습)</h3><ol class="detailsList">${d.sourceDetails.map(t=>`<li>${line(t.replace(/^\s*[①②③④⑤⑥]\s*/,''))}</li>`).join('')}</ol></div>`:''}
${d&&d.example?`<div class="mt"><h3 class="boxTitle">연관 명령어·설정·계산</h3><pre class="demo">${e(d.example)}</pre></div>`:''}
${d?.pitfall?`<div class="caution mt"><b>헷갈리기 쉬운 부분</b><div class="textBlock">${line(d.pitfall)}</div></div>`:''}`}
function quiz(){const qs=filteredQs();const q=choiceSelect();let idx=qs.findIndex(x=>x.id===q?.id);return `${hd('유형별 문제풀이','단답형 25문항 · 서술형 25문항 · 실무형 5세트. 정답을 보기 전에 반드시 직접 작성하세요.')}
<div class="controlRow mb"><div class="chips">${[['all','전체'],['short','단답형'],['essay','서술형'],['case','실무형']].map(([x,y])=>`<button class="chip ${UI.quizType===x?'active':''}" data-qtype="${x}">${y}</button>`).join('')}</div><select class="select" id="quizPr" aria-label="중요도 필터"><option value="all" ${UI.quizPr==='all'?'selected':''}>중요도 전체</option><option value="3" ${UI.quizPr==='3'?'selected':''}>★★★ 최우선</option><option value="2" ${UI.quizPr==='2'?'selected':''}>★★ 중요</option><option value="1" ${UI.quizPr==='1'?'selected':''}>★ 보충</option></select><input id="quizSearch" class="search" placeholder="문제 검색" value="${e(UI.quizQuery)}" aria-label="문제 검색"/></div>
${!q?'<div class="empty">조건에 맞는 문제가 없습니다.</div>':`<div class="quizLayout"><div><div class="panel"><div class="split"><div class="controlRow"><span class="pill p2">${labelType(q.type)}</span>${badge(q.priority)}<span class="muted small">문제 ${idx+1}/${qs.length}</span></div><div class="controlRow"><button class="btn" data-action="fav" data-id="${e(q.id)}">${saved.favorites[q.id]?'★ 즐겨찾기':'☆ 즐겨찾기'}</button></div></div><h2 style="margin:14px 0 17px;font-size:20px">${e(q.title)}</h2><div class="qBox"><div class="qText">${line(q.question)}</div></div><label class="small muted" for="quizAnswer" style="display:block;margin-top:16px;font-weight:750">내 답안 (자동 저장)</label><textarea id="quizAnswer" class="editor" placeholder="먼저 스스로 정의·원인·대응을 작성하세요. 실무형은 증거→판단→조치→검증 순서로 작성합니다.">${e(saved.draft[q.id]||'')}</textarea><div class="split mt"><div class="controlRow"><button class="btn primary" data-action="q-reveal">${UI.quizReveal?'해설 접기':'정답과 해설 확인'}</button><button class="btn" data-action="q-prev" ${idx===0?'disabled':''}>← 이전 문제</button><button class="btn" data-action="q-next" ${idx===qs.length-1?'disabled':''}>다음 문제 →</button></div><span class="muted small">${saved.answered[q.id]==='know'?'✓ 해결':saved.answered[q.id]==='wrong'?'↺ 오답':saved.answered[q.id]==='partial'?'△ 부분 암기':'미채점'}</span></div></div>
${UI.quizReveal?`<div class="panel mt"><div class="split"><h2 style="margin:0;font-size:20px">모범답안과 단계별 해설</h2><button class="btn soft" data-action="step-all">한꺼번에 전체 보기</button></div><p class="tip mt">모범답안은 상세 학습서에서, 단계별 추가 설명은 문제 이해를 돕기 위해 새로 구성했습니다.</p><div class="model mt"><h3>정답 / 실기 답안 예시</h3><div class="textBlock">${line(q.answer)}</div></div>${q.keywords.length?`<div class="mt"><b>핵심 채점 요소</b><div>${q.keywords.map(x=>`<span class="keyword">${e(x)}</span>`).join('')}</div></div>`:''}
<div class="line"></div><div class="split"><h3 class="boxTitle">1단계부터 차근차근 이해하기</h3><span class="muted small">${UI.quizStep}/5단계 공개</span></div>${UI.quizStep?helpSteps(q,UI.quizStep):'<div class="notePanel">해설을 한 단계씩 보면 스스로 답을 생각해 볼 시간을 확보할 수 있습니다.</div>'}<div class="controlRow mt"><button class="btn primary" data-action="step-next" ${UI.quizStep>=5?'disabled':''}>${UI.quizStep===0?'1단계 해설 시작':'다음 단계 해설 →'}</button>${UI.quizStep>=5&&topicOf(q)?`<button class="btn" data-topic="${e(q.lesson)}">전체 이론 상세히 보기</button>`:''}</div>${UI.quizStep>=5&&topicOf(q)?`<div class="mt"><h3 class="boxTitle">상세 학습서 원문으로 더 이해하기</h3><ol class="detailsList">${topicOf(q).sourceDetails.map(t=>`<li>${line(t.replace(/^\s*[①②③④⑤]\s*/,''))}</li>`).join('')}</ol><pre class="demo">${e(topicOf(q).example)}</pre>${topicOf(q).pitfall?`<div class="caution mt">${line(topicOf(q).pitfall)}</div>`:''}</div>`:''}
<div class="line"></div><h3 class="boxTitle">자가채점과 복습 상태</h3><p class="tip">점수 자동채점은 하지 않습니다. 본인의 서술이 핵심 채점 요소를 충족했는지 보고 판단하세요.</p><div class="controlRow"><button class="btn green" data-action="q-grade" data-v="know">✓ 정확히 작성</button><button class="btn" data-action="q-grade" data-v="partial">△ 일부 부족</button><button class="btn warn" data-action="q-grade" data-v="wrong">↺ 다시 풀기</button></div></div>`:''}</div>
<aside class="card sidebarCard"><h3 class="boxTitle">문제 찾아가기</h3><div class="muted small">총 ${qs.length}문항 · 직접 채점한 기록 저장</div><div style="max-height:510px;overflow:auto;margin-top:8px">${qs.map((x,j)=>`<button class="quickItem ${x.id===q.id?'on':''}" data-qid="${e(x.id)}" style="width:100%;text-align:left"><div><small>${j+1}. ${labelType(x.type)}</small><div style="font-size:12px;font-weight:750;line-height:1.5">${e(x.title)}</div></div><div>${saved.answered[x.id]==='know'?'✓':saved.answered[x.id]==='wrong'?'↺':saved.answered[x.id]==='partial'?'△':''}</div></button>`).join('')}</div></aside></div>`}`}
function review(){let arr=Q.filter(q=>UI.reviewMode==='wrong'?saved.answered[q.id]==='wrong':UI.reviewMode==='partial'?saved.answered[q.id]==='partial':UI.reviewMode==='favorite'?saved.favorites[q.id]:saved.answered[q.id]);return `${hd('오답·복습','틀린 문제와 중요하게 표시한 문제를 중심으로 다시 풀어보세요.')}
<div class="chips mb">${[['wrong','↺ 오답'],['partial','△ 부분 암기'],['favorite','★ 즐겨찾기'],['all','전체 풀이 기록']].map(([v,t])=>`<button class="chip ${UI.reviewMode===v?'active':''}" data-review="${v}">${t}</button>`).join('')}</div>${arr.length?`<div class="overviewList">${arr.map((q,i)=>`<button class="topicLink" data-qid="${e(q.id)}"><div><small>${labelType(q.type)} · ${priority(q.priority)}</small><b>${e(q.title)}</b></div><span class="muted small">다시 풀기 →</span></button>`).join('')}</div>`:`<div class="empty">이 범주에 저장된 문제가 없습니다.<div class="mt"><button class="btn primary" data-nav="quiz">문제풀이 시작</button></div></div>`}`}
function shuffle(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeMock(){const ss=shuffle(Q.filter(x=>x.type==='short')).slice(0,12).map(x=>x.id);const ee=shuffle(Q.filter(x=>x.type==='essay')).slice(0,4).map(x=>x.id);const cc=shuffle(Q.filter(x=>x.type==='case')).slice(0,2).map(x=>x.id);saved.mock={stage:'taking',short:ss,essay:ee,choices:cc,chosen:cc[0],answers:{},grades:{},start:Date.now(),limit:Math.max(30,Math.min(240,Number(UI.mockTime)||120)),score:null};save();notify('실전 모의고사가 시작되었습니다');render()}
function examItems(m){return [...m.short,...m.essay,m.chosen].map(byQ).filter(Boolean)}
function fmtTime(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timeRemaining(m){return (m.start+m.limit*60000)-Date.now()}
function gradePart(q,m){return m.grades[q.id]==null?'':Number(m.grades[q.id])}
function mock(){const m=saved.mock;if(!m||m.stage==='setup')return `${hd('실전 모의고사','사용자가 제시한 문항 유형·배점을 반영한 학습용 모의고사입니다.')}
<div class="panel"><h2>17문항 · 100점</h2><div class="grid stats"><div class="stat"><b>12<small>문항</small></b><span>단답형 · 각 3점 · 36점</span></div><div class="stat"><b>4<small>문항</small></b><span>서술형 · 각 12점 · 48점</span></div><div class="stat"><b>1<small>문항</small></b><span>실무형 2개 중 1개 · 16점</span></div></div><div class="line"></div><p>모든 답을 직접 작성한 후 <b>정답·단계별 해설</b>을 공개합니다. 서술형·실무형은 공식 자동채점이 불가능하므로 학습용 기준에 따라 자가채점합니다.</p><div class="banner mb">실제 시험의 선택 안내·시간·배점은 시험지에 적힌 기준이 우선입니다. 아래 제한시간은 학습용으로 조정 가능합니다.</div><div class="row stack"><div><label for="mockTime" class="small"><b>연습 제한시간</b></label><select class="select" id="mockTime"><option value="60" ${UI.mockTime===60?'selected':''}>60분</option><option value="90" ${UI.mockTime===90?'selected':''}>90분</option><option value="120" ${UI.mockTime===120?'selected':''}>120분</option><option value="180" ${UI.mockTime===180?'selected':''}>180분</option></select></div><button class="btn primary" data-action="mock-start">새 모의고사 시작 →</button></div></div>`;
if(m.stage==='taking')return `${hd('실전 모의고사 · 답안 작성 중','단답 12문항, 서술 4문항, 실무형 2문항 중 1문항 선택. 제출하면 해설을 공개합니다.')}
<div class="panel mb"><div class="split"><div><b>17문항 · 100점</b><div class="muted small">진행 중인 답안은 브라우저에 자동 저장됩니다.</div></div><div><span class="timer" id="countdown">${fmtTime(timeRemaining(m))}</span></div></div><div class="mt" id="examP">${Object.values(m.answers).filter(v=>String(v).trim()).length}/17개 답안 작성</div><div class="progress"><div style="width:${pct(Object.values(m.answers).filter(v=>String(v).trim()).length,17)}%"></div></div></div>
${[...m.short,...m.essay].map((id,i)=>examQuestion(byQ(id),i+1,m)).join('')}
<div class="panel mb"><div class="split"><h2 style="margin:0">실무형 · 2문항 중 1문항 선택 (16점)</h2><span class="pill p3">선택형</span></div><p class="tip">두 문제를 읽고 자신 있는 한 문제를 선택해 풉니다. 선택하지 않은 문제는 점수에 포함되지 않습니다.</p><div class="g2">${m.choices.map((id,i)=>{const q=byQ(id);return `<button class="topicLink ${m.chosen===id?'on':''}" data-choose-case="${e(id)}" aria-pressed="${m.chosen===id}"><div><small>선택지 ${i+1}</small><b>${e(q.title)}</b></div><span>${m.chosen===id?'☑ 선택':'□'}</span></button>`}).join('')}</div></div>${examQuestion(byQ(m.chosen),17,m)}
<div class="panel"><div class="split"><span class="muted small">현재 답안을 저장한 뒤 제출해 주세요.</span><button class="btn primary" data-action="mock-submit">답안 제출 · 정답 공개</button></div></div>`;
if(m.stage==='grading')return `${hd('모의고사 · 정답 확인 및 자가채점','모범답안을 보고 핵심 요소를 충족한 만큼 점수를 입력하세요. 모든 문항을 평가한 뒤 최종 결과를 계산합니다.')}
<div class="panel mb"><div class="split"><h2 style="margin:0">학습용 채점 기준</h2><span class="pill p2">총 100점</span></div><p class="tip">아래 키워드는 공부용 기준입니다. 실제 채점위원의 공식 점수·부분점수와 일치한다고 보장할 수 없습니다. 각 문항 0점~만점 사이에서 스스로 평가합니다.</p><div class="row"><b id="gradingCount">${Object.keys(m.grades).filter(k=>m.grades[k]!==null&&m.grades[k]!==undefined).length}/17 평가 완료</b><button class="btn primary" data-action="mock-finish">모든 채점 완료 → 결과 보기</button></div></div>
${examItems(m).map((q,i)=>`<div class="panel examQ"><div class="split"><h3 style="margin:0">${i+1}. ${labelType(q.type)} — ${e(q.title)}</h3><span class="tag">${q.max}점</span></div><div class="qBox mt"><div class="qText">${line(q.question)}</div></div><h4>내 답안</h4><div class="mutedBlock textBlock">${line(m.answers[q.id]||'(미작성)')}</div><div class="mt">${explanation(q)}</div><div class="split mt"><label for="grade-${e(q.id)}"><b>자가채점</b> <span class="muted small">0~${q.max}점</span></label><input id="grade-${e(q.id)}" data-grade="${e(q.id)}" class="scoreInput" type="number" min="0" max="${q.max}" step="1" value="${m.grades[q.id]??''}" placeholder="0~${q.max}"></div></div>`).join('')}
<div class="panel"><button class="btn primary" data-action="mock-finish">채점 완료 및 점수 계산</button></div>`;
return `${hd('모의고사 결과','학습용 자가채점 결과입니다. 실제 시험 점수를 의미하지 않습니다.')}
<div class="panel center"><p class="muted small">이번 모의고사</p><div style="font-size:67px;font-weight:900;line-height:1.2;color:${m.score>=60?'var(--teal)':'var(--danger)'}">${m.score}<span style="font-size:24px">/100점</span></div><p><span class="pill ${m.score>=60?'p2':'p3'}">${m.score>=60?'60점 기준 통과':'60점 기준 미달'}</span></p><div class="grid stats mt">${[['단답형',m.short],['서술형',m.essay],['실무형',[m.chosen]]].map(([n,l])=>`<div class="stat"><b>${l.reduce((s,id)=>s+Number(m.grades[id]||0),0)}<small>점</small></b><span>${n}</span></div>`).join('')}</div><div class="controlRow mt" style="justify-content:center"><button class="btn primary" data-action="mock-reset">새 모의고사 시작</button><button class="btn" data-nav="review">오답·복습</button></div></div>
${examItems(m).map((q,i)=>`<div class="card mt"><b>${i+1}. ${labelType(q.type)} · ${e(q.title)}</b><p class="muted small">자가채점 ${m.grades[q.id]}/${q.max}점</p><div class="textBlock">${line(q.answer)}</div><div class="controlRow mt"><button class="btn soft" data-qid="${e(q.id)}">해설 복습 →</button></div></div>`).join('')}`}
function examQuestion(q,num,m){return `<div class="panel examQ"><div class="split"><div class="ansHead"><span class="pill p2">${labelType(q.type)}</span><b>${num}. ${e(q.title)}</b></div><span class="maxScore">${q.max}점</span></div><div class="qBox mt"><div class="qText">${line(q.question)}</div></div><textarea class="editor mt" data-exam-answer="${e(q.id)}" placeholder="문제 근거와 정답을 직접 작성하세요. (자동 저장)">${e(m.answers[q.id]||'')}</textarea></div>`}
function updateCountdown(){if(saved.mock?.stage==='taking'&&UI.view==='mock'&&$('#countdown')){$('#countdown').textContent=fmtTime(timeRemaining(saved.mock));if(timeRemaining(saved.mock)<=0){$('#countdown').textContent='연습시간 종료';}}}
setInterval(updateCountdown,1000);
function changeQ(id){UI.quizId=id;UI.quizReveal=false;UI.quizStep=0;UI.view='quiz';render();window.scrollTo(0,0)}
// Event delegation keeps a single HTML functional without external scripts.
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-nav],[data-action],[data-topic],[data-qid],[data-pr],[data-mpr],[data-qtype],[data-review],[data-choose-case]');if(!b)return;
if(b.dataset.nav){goto(b.dataset.nav);return}
if(b.dataset.topic){UI.topic=b.dataset.topic;UI.view='learn';render();window.scrollTo(0,0);return}
if(b.dataset.qid){changeQ(b.dataset.qid);return}
if(b.dataset.pr){UI.topicPr=b.dataset.pr;render();return}
if(b.dataset.mpr){UI.memoryPr=b.dataset.mpr;render();return}
if(b.dataset.qtype){UI.quizType=b.dataset.qtype;UI.quizReveal=false;UI.quizStep=0;render();return}
if(b.dataset.review){UI.reviewMode=b.dataset.review;render();return}
if(b.dataset.chooseCase){if(saved.mock?.stage==='taking'){saved.mock.chosen=b.dataset.chooseCase;save();render()}return}
const a=b.dataset.action;
if(a==='menu'){$('#side').classList.toggle('open');return}
if(a==='go-mock'){goto('mock');return}
if(a==='open-priority'){UI.topic=DATA[0].id;goto('learn');return}
if(a==='open-quiz'){goto('quiz');return}
if(a==='essay-first'){UI.quizType='essay';UI.quizPr='3';goto('quiz');return}
if(a==='learned'){let id=b.dataset.id;saved.learn[id]=!saved.learn[id];save();render();notify(saved.learn[id]?'학습 완료로 표시했습니다':'학습 완료 표시를 해제했습니다');return}
if(a==='next-topic'){UI.topic=DATA[(DATA.findIndex(x=>x.id===UI.topic)+1)%25].id;render();window.scrollTo(0,0);return}
if(a==='quiz-for'){UI.quizId='e-'+b.dataset.id;UI.quizType='all';UI.quizPr='all';UI.quizQuery='';UI.quizReveal=false;UI.quizStep=0;goto('quiz');return}
if(a==='mem-toggle'){let i=b.dataset.i;UI.revealedMem[i]=!UI.revealedMem[i];render();return}
if(a==='mem-mark'){saved.mem[b.dataset.i]=b.dataset.v;save();render();return}
if(a==='fav'){saved.favorites[b.dataset.id]=!saved.favorites[b.dataset.id];save();render();return}
if(a==='q-reveal'){UI.quizReveal=!UI.quizReveal;UI.quizStep=0;render();return}
if(a==='step-next'){UI.quizStep=Math.min(5,UI.quizStep+1);render();return}
if(a==='step-all'){UI.quizStep=5;render();return}
if(a==='q-prev'||a==='q-next'){const l=filteredQs();let j=l.findIndex(x=>x.id===UI.quizId)+(a==='q-prev'?-1:1);if(l[j])changeQ(l[j].id);return}
if(a==='q-grade'){saved.answered[UI.quizId]=b.dataset.v;save();render();notify('복습 상태를 저장했습니다');return}
if(a==='mock-start'){makeMock();return}
if(a==='mock-submit'){if(saved.mock){let cnt=examItems(saved.mock).filter(q=>String(saved.mock.answers[q.id]||'').trim()).length;if(cnt<17&&!confirm(`답안을 작성한 문항은 ${cnt}/17개입니다. 정답과 해설을 공개하고 채점할까요?`))return;saved.mock.stage='grading';save();render();window.scrollTo(0,0)}return}
if(a==='mock-finish'){let m=saved.mock;let items=examItems(m);if(items.some(q=>m.grades[q.id]==null||m.grades[q.id]==='')){notify('모든 문항의 점수를 입력해 주세요');return}m.score=items.reduce((n,q)=>n+Number(m.grades[q.id]||0),0);m.stage='complete';saved.mockHistory.unshift({time:Date.now(),score:m.score});saved.mockHistory=saved.mockHistory.slice(0,20);for(let q of items){saved.answered[q.id]=Number(m.grades[q.id])===q.max?'know':Number(m.grades[q.id])===0?'wrong':'partial'}save();render();window.scrollTo(0,0);return}
if(a==='mock-reset'){if(saved.mock?.stage!=='complete'&&!confirm('진행 중인 기록을 초기화할까요?'))return;saved.mock=null;save();render();return}
});
document.addEventListener('input',ev=>{let t=ev.target;
if(t.id==='topicSearch'){UI.query=t.value;const items=topicsFiltered();$('#topicOptions').innerHTML=items.map(x=>`<button class="topicLink ${UI.topic===x.id?'on':''}" data-topic="${e(x.id)}"><div><small>${String(x.n).padStart(2,'0')} · ${priority(x.priority)}</small><b>${e(x.title)}</b></div></button>`).join('')||'<p class="muted">검색 결과가 없습니다.</p>';return}
if(t.id==='quizSearch'){UI.quizQuery=t.value;render();let el=$('#quizSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}return}
if(t.id==='quizAnswer'){saved.draft[UI.quizId]=t.value;save();return}
if(t.dataset.examAnswer){saved.mock.answers[t.dataset.examAnswer]=t.value;save();const count=examItems(saved.mock).filter(q=>String(saved.mock.answers[q.id]||'').trim()).length;const el=$('#examP');if(el)el.textContent=`${count}/17개 답안 작성`;return}
if(t.dataset.grade){let q=byQ(t.dataset.grade);let v=t.value;if(v===''){saved.mock.grades[q.id]=null;}else{let n=Number(v);saved.mock.grades[q.id]=Number.isFinite(n)?Math.max(0,Math.min(q.max,Math.round(n))):null}save();const el=$('#gradingCount');if(el)el.textContent=`${Object.values(saved.mock.grades).filter(x=>x!==null&&x!==undefined).length}/17 평가 완료`;return}
});
document.addEventListener('change',ev=>{if(ev.target.id==='quizPr'){UI.quizPr=ev.target.value;UI.quizReveal=false;UI.quizStep=0;render()}if(ev.target.id==='mockTime')UI.mockTime=Number(ev.target.value)});
// Convenient native back/forward is not needed; core is fully standalone.
render();
</script>
</body></html>
